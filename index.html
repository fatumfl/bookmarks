      function exportStateToJson() {
        const payload = {
          app: "BOOKMARKS_DASHBOARD",
          version: DATA_VERSION,
          exportedAt: new Date().toISOString(),
          settings: {
            gridCols: state.gridCols, gridRows: state.gridRows, viewMode: state.viewMode,
            theme: state.theme, font: state.font, lang: state.lang
          },
          folders: state.folders
        };
        const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `bookmarks-backup-${new Date().toISOString().slice(0, 10)}.json`;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 2000);

        state.hasUnsavedExport = false;
        saveData(false);
        $("ioStatusDesc").textContent = t("allSavedWarning");
        showToast(t("exportedOk"));
      }

      function handleImportFileSelected(file) {
        if (!file) return;
        if (file.size > 5 * 1024 * 1024) { showToast(t("invalidJson")); return; }
        const reader = new FileReader();
        reader.onerror = () => showToast(t("invalidJson"));
        reader.onload = () => {
          let parsed;
          try { parsed = JSON.parse(String(reader.result || "")); } catch (_e) { showToast(t("invalidJson")); return; }

          let incoming = null;
          let settings = null;
          if (Array.isArray(parsed)) {
            incoming = parsed;
          } else if (parsed && typeof parsed === "object" && Array.isArray(parsed.folders)) {
            if (parsed.app && parsed.app !== "BOOKMARKS_DASHBOARD") { showToast(t("importWrongApp")); return; }
            if (Number(parsed.version) > DATA_VERSION) { showToast(t("importNewerVersion")); return; }
            incoming = parsed.folders;
            settings = parsed.settings && typeof parsed.settings === "object" ? parsed.settings : null;
          }
          if (!incoming) { showToast(t("invalidJson")); return; }

          const { folders, skipped } = sanitizeFolders(incoming);
          if (!folders.length) { showToast(t("invalidJson")); return; }

          pendingImportData = { folders, settings, skipped };
          const total = folders.reduce((sum, f) => sum + f.bookmarks.length, 0);
          $("importChoiceText").textContent = t("importPreview", folders.length, total, skipped);
          $("importSettingsRow").style.display = settings ? "flex" : "none";
          $("importChoiceBox").style.display = "flex";
        };
        reader.readAsText(file);
      }

      function applyImportedSettings(s) {
        const dim = (v) => Math.min(8, Math.max(1, Math.round(Number(v)) || 3));
        if (s.gridCols) state.gridCols = dim(s.gridCols);
        if (s.gridRows) state.gridRows = dim(s.gridRows);
        if (s.viewMode === "grid" || s.viewMode === "list") state.viewMode = s.viewMode;
        if (s.theme === "dark" || s.theme === "light") state.theme = s.theme;
        if (s.font === "sans" || s.font === "mono") state.font = s.font;
        if (s.lang === "en" || s.lang === "ru") state.lang = s.lang;
        savePrefs();
      }

      function applyImportedData(mode) {
        const imp = pendingImportData;
        if (!imp) return;
        let addedF = 0, addedB = 0;

        if ($("importSettingsChk").checked && imp.settings) applyImportedSettings(imp.settings);
        closeIoModal();

        mutate(() => {
          if (mode === "overwrite") {
            state.folders = imp.folders;
            state.activeFolderId = imp.folders[0].id;
            addedF = imp.folders.length;
            imp.folders.forEach((f) => { addedB += f.bookmarks.length; });
          } else {
            let firstTouched = null;
            imp.folders.forEach((f) => {
              const same = state.folders.find((x) => x.name.toLowerCase() === f.name.toLowerCase());
              if (same) {
                const urls = new Set(same.bookmarks.map((b) => b.url));
                f.bookmarks.forEach((b) => {
                  if (urls.has(b.url)) return;
                  urls.add(b.url);
                  same.bookmarks.push(Object.assign({}, b, { id: uid("b") }));
                  addedB++;
                });
                if (!firstTouched) firstTouched = same.id;
              } else {
                const nf = Object.assign({}, f, { id: uid("f"), bookmarks: f.bookmarks.map((b) => Object.assign({}, b, { id: uid("b") })) });
                state.folders.push(nf);
                addedF++;
                addedB += nf.bookmarks.length;
                if (!firstTouched) firstTouched = nf.id;
              }
            });
            if (firstTouched) state.activeFolderId = firstTouched;
          }
          state.carouselPage = 0;
        });
        savePrefs();
        showToast(t("importResult", addedF, addedB, imp.skipped), { actionLabel: t("undo"), onAction: undo });
      }

      /* =====================================================================
         WELCOME & LICENCE
         ===================================================================== */
      function openInfoModal(kind) {
        const titleEl = $("infoModalTitle");
        const contentEl = $("infoModalContent");

        if (kind === "licence") {
          titleEl.textContent = t("licenceTitle");
          contentEl.innerHTML = `
            <p>Lorem ipsum dolor sit amet, consectetur adipiscing elit. Integer nec odio. Praesent libero. Sed cursus ante dapibus diam. Sed nisi. Nulla quis sem at nibh elementum imperdiet.</p>
            <p>Duis sagittis ipsum. Praesent mauris. Fusce nec tellus sed augue semper porta. Mauris massa. Vestibulum lacinia arcu eget nulla. Class aptent taciti sociosqu ad litora torquent per conubia nostra.</p>
          `;
        } else {
          titleEl.textContent = t("welcomeTitle");
          if (state.lang === "ru") {
            contentEl.innerHTML = `
              <p><strong>Bookmarks</strong> — персональная стартовая страница для организации папок и закладок прямо в браузере.</p>
              <p>Все данные хранятся локально в <strong>localStorage</strong>. При очистке данных браузера или сбое хранилища изменения могут быть утеряны — регулярно делайте резервную копию через <strong>Export JSON</strong> (или команду <code>@export</code> в поиске).</p>
              <p>Программа предоставляется «как есть» (AS IS), без каких-либо явных или подразумеваемых гарантий.</p>
              <p>Документ лицензии: <button type="button" id="openLicenceFromWelcome" class="inline-link-btn">${escapeHtml(t("licenceLinkText"))}</button></p>
            `;
          } else {
            contentEl.innerHTML = `
              <p><strong>Bookmarks</strong> is a single-user personal dashboard for organizing folders and bookmarks locally in your browser.</p>
              <p>All data is stored in <strong>localStorage</strong>. Clearing browser storage can erase your changes — export backups manually via <strong>Export JSON</strong> (or the <code>@export</code> search command).</p>
              <p>Provided "AS IS" without warranties of any kind.</p>
              <p>Licence terms: <button type="button" id="openLicenceFromWelcome" class="inline-link-btn">${escapeHtml(t("licenceLinkText"))}</button></p>
            `;
          }
        }
        openModal("infoModalBackdrop", "infoModalCloseBtn");
      }

      function closeInfoModal() {
        if (!hideModal("infoModalBackdrop")) return;
        if (!state.welcomeShown) {
          state.welcomeShown = true;
          savePrefs();
        }
      }

      /* =====================================================================
         THEME / FONT / LANGUAGE / POPOVERS
         ===================================================================== */
      function toggleTheme() { state.theme = state.theme === "dark" ? "light" : "dark"; savePrefs(); applyVisualSettings(); }
      function toggleFont() { state.font = state.font === "sans" ? "mono" : "sans"; savePrefs(); renderAll(); }
      function toggleLang() { state.lang = state.lang === "ru" ? "en" : "ru"; savePrefs(); renderAll(); }

      function applyVisualSettings() {
        document.documentElement.setAttribute("data-theme", state.theme);
        document.documentElement.setAttribute("data-font", state.font);
        document.documentElement.lang = state.lang;

        $("globalSearchInput").placeholder = t("searchPlaceholder");

        $("themeModeIcon").innerHTML = state.theme === "dark" ? ICON_PATHS[37] : ICON_PATHS[38];

        document.querySelectorAll("[data-i18n]").forEach((el) => { el.textContent = t(el.getAttribute("data-i18n")); });
        document.querySelectorAll("[data-i18n-title]").forEach((el) => {
          const v = t(el.getAttribute("data-i18n-title"));
          el.title = v;
          el.setAttribute("aria-label", v);
        });
        $("globalSearchInput").title = t("searchPlaceholder");

        renderDropdown();
        syncConfigButtons();
        syncDirtyIndicator();
        syncUndoButton();
        syncLockSortButton();
      }

      function syncConfigButtons() {
        const view = $("cfgViewModeBtn");
        const font = $("cfgFontBtn");
        view.classList.toggle("active-state", state.viewMode === "list");
        view.setAttribute("aria-pressed", String(state.viewMode === "list"));
        font.classList.toggle("active-state", state.font === "mono");
        font.setAttribute("aria-pressed", String(state.font === "mono"));
      }

      function closePopovers() {
        $("gridMatrixPopover").classList.remove("open");
        $("folderCreatorPopover").classList.remove("open");
        $("moreMenuPopover").classList.remove("open");
      }

      function renderAll() {
        applyVisualSettings();
        renderFoldersSidebar();
        renderBookmarksStage();
      }

      /* =====================================================================
         CAROUSEL NAVIGATION
         ===================================================================== */
      function getTotalGridPages() {
        if ($("globalSearchInput").value.trim() || state.viewMode !== "grid") return 1;
        const f = state.folders.find((x) => x.id === state.activeFolderId) || state.folders[0];
        if (!f || !f.bookmarks.length) return 1;
        const { cols, rows } = getEffectiveGridDimensions(f.bookmarks);
        return Math.max(1, Math.ceil(f.bookmarks.length / Math.max(1, cols * rows)));
      }

      function stepCarouselPage(delta) {
        const total = getTotalGridPages();
        if (total <= 1) return;
        const next = Math.min(total - 1, Math.max(0, state.carouselPage + delta));
        if (next !== state.carouselPage) {
          state.carouselPage = next;
          renderBookmarksStage();
        }
      }

      function bindCarouselGestures() {
        const stage = $("bookmarksStage");

        let wheelLock = false;
        stage.addEventListener("wheel", (e) => {
          if (state.viewMode !== "grid" || $("globalSearchInput").value.trim()) return;
          if (getTotalGridPages() <= 1) return;
          const delta = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
          if (Math.abs(delta) < 12) return;
          e.preventDefault();
          if (wheelLock) return;
          wheelLock = true;
          stepCarouselPage(delta > 0 ? 1 : -1);
          setTimeout(() => { wheelLock = false; }, 180);
        }, { passive: false });

        // Мышь/перо: жест по свободному месту. Тач обрабатывается touch-жестами ниже
        // (в том числе поверх карточек).
        let px = null, py = null;
        stage.addEventListener("pointerdown", (e) => {
          if (e.pointerType === "touch" || e.target.closest("a, button")) return;
          px = e.clientX; py = e.clientY;
        });
        stage.addEventListener("pointerup", (e) => {
          if (px === null) return;
          const dx = e.clientX - px, dy = e.clientY - py;
          px = py = null;
          if (Math.abs(dx) > 48 && Math.abs(dx) > Math.abs(dy) * 1.2) stepCarouselPage(dx < 0 ? 1 : -1);
        });

        bindTouchGestures(stage, {
          itemSel: ".bookmark-card, .bookmarks-list-group",
          onReorder: (a, b) => reorderBookmarksInFolder(state.activeFolderId, a, b),
          onSwipe: (dir) => {
            if (state.viewMode === "grid" && !$("globalSearchInput").value.trim()) stepCarouselPage(dir);
          }
        });

        bindTouchGestures($("folderList"), {
          itemSel: ".folder-row",
          canDrag: () => !state.folderSortLocked,
          onReorder: reorderFolders
        });
      }

      /* =====================================================================
         EVENTS
         ===================================================================== */
      function focusSearch(select) {
        const input = $("globalSearchInput");
        input.focus();
        if (select) input.select();
      }

      function bindEvents() {
        $("brandLogoSlot").innerHTML = PAPERCLIP_SVG;

        $("toggleRailBtn").addEventListener("click", () => {
          state.sidebarExpanded = !state.sidebarExpanded;
          savePrefs();
          renderFoldersSidebar();
        });

        $("lockSortBtn").addEventListener("click", () => {
          state.folderSortLocked = !state.folderSortLocked;
          savePrefs();
          renderFoldersSidebar();
          showToast(state.folderSortLocked ? t("sortLockedToast") : t("sortUnlockedToast"));
        });

        $("addFolderBtn").addEventListener("click", (e) => {
          e.stopPropagation();
          openFolderPopover(null, e.currentTarget);
        });

        $("cancelFolderBtn").addEventListener("click", closePopovers);
        $("confirmFolderBtn").addEventListener("click", confirmFolderPopover);
        $("newFolderNameInput").addEventListener("keydown", (e) => {
          if (e.key === "Enter") confirmFolderPopover();
          if (e.key === "Escape") closePopovers();
        });

        /* Search */
        const searchInput = $("globalSearchInput");
        const clearBtn = $("clearSearchBtn");

        searchInput.addEventListener("input", () => {
          clearBtn.classList.toggle("visible", searchInput.value.length > 0);
          ddIndex = -1;
          renderDropdown();
          renderBookmarksStage();
        });
        searchInput.addEventListener("focus", renderDropdown);

        searchInput.addEventListener("keydown", (e) => {
          const open = $("atCommandsDropdown").classList.contains("open") && ddItems.length > 0;

          if (open && (e.key === "ArrowDown" || e.key === "ArrowUp")) {
            e.preventDefault();
            const n = ddItems.length;
            ddIndex = e.key === "ArrowDown" ? (ddIndex + 1) % n : (ddIndex <= 0 ? n - 1 : ddIndex - 1);
            renderDropdown();
            return;
          }
          if (open && e.key === "Tab" && !e.shiftKey) {
            e.preventDefault();
            applyDropdownItem(ddItems[ddIndex >= 0 ? ddIndex : 0], true);
            return;
          }
          if (e.key !== "Enter") return;
          e.preventDefault();

          if (open && ddIndex >= 0) {
            applyDropdownItem(ddItems[ddIndex], false);
            return;
          }
          const val = searchInput.value;
          if (val.trim().startsWith("@")) {
            if (executeSearchCommand(val)) return;
            const only = ddItems.length === 1 && ddItems[0].kind === "cmd" ? ddItems[0] : null;
            // Деструктивную команду по неполному вводу не выполняем — только дописываем
            if (only) applyDropdownItem(only, only.text === "@clear");
            return;
          }
          openFirstSearchResult();
        });

        clearBtn.addEventListener("click", () => {
          resetSearchInput();
          searchInput.focus();
        });

        document.querySelectorAll(".search-hint-chip").forEach((chip) => {
          chip.addEventListener("click", () => {
            const sample = chip.dataset.sample || "";
            const cur = searchInput.value.trim();
            searchInput.value = cur ? `${cur} ${sample}` : sample;
            clearBtn.classList.toggle("visible", searchInput.value.length > 0);
            ddIndex = -1;
            renderDropdown();
            renderBookmarksStage();
            searchInput.focus();
          });
        });

        /* Dock */
        $("cfgUndoBtn").addEventListener("click", (e) => { e.stopPropagation(); undo(); });

        $("cfgGridSizeBtn").addEventListener("click", (e) => {
          e.stopPropagation();
          const pop = $("gridMatrixPopover");
          const wasOpen = pop.classList.contains("open");
          closePopovers();
          if (!wasOpen) {
            initGridMatrixPicker();
            pop.classList.add("open");
          }
        });

        $("cfgViewModeBtn").addEventListener("click", () => {
          state.viewMode = state.viewMode === "grid" ? "list" : "grid";
          state.carouselPage = 0;
          savePrefs();
          syncConfigButtons();
          renderBookmarksStage();
        });

        $("cfgThemeBtn").addEventListener("click", toggleTheme);
        $("cfgFontBtn").addEventListener("click", toggleFont);
        $("cfgLangBtn").addEventListener("click", toggleLang);

        $("cfgMoreBtn").addEventListener("click", (e) => {
          e.stopPropagation();
          const pop = $("moreMenuPopover");
          const wasOpen = pop.classList.contains("open");
          closePopovers();
          if (!wasOpen) pop.classList.add("open");
        });
        $("moreThemeBtn").addEventListener("click", () => { closePopovers(); toggleTheme(); });
        $("moreFontBtn").addEventListener("click", () => { closePopovers(); toggleFont(); });
        $("moreLangBtn").addEventListener("click", () => { closePopovers(); toggleLang(); });

        $("cfgIoBtn").addEventListener("click", (e) => { e.stopPropagation(); openIoModal(); });
        $("cfgAddBookmarkBtn").addEventListener("click", (e) => { e.stopPropagation(); openBookmarkModal(state.activeFolderId, null); });

        /* Bookmark modal */
        $("bmCancelBtn").addEventListener("click", closeBookmarkModal);
        $("bmSaveBtn").addEventListener("click", saveBookmarkFromModal);
        $("bookmarkModalBackdrop").addEventListener("click", (e) => { if (e.target === e.currentTarget) closeBookmarkModal(); });
        ["bmTitleInput", "bmUrlInput", "bmIconInput", "bmTagsInput"].forEach((id) => {
          $(id).addEventListener("keydown", (e) => {
            if (e.key === "Enter") { e.preventDefault(); saveBookmarkFromModal(); }
          });
        });

        /* IO modal */
        $("ioCloseBtn").addEventListener("click", closeIoModal);
        $("ioModalBackdrop").addEventListener("click", (e) => { if (e.target === e.currentTarget) closeIoModal(); });
        $("exportJsonBtn").addEventListener("click", exportStateToJson);
        $("importJsonTriggerBtn").addEventListener("click", () => $("importFileInput").click());
        $("importFileInput").addEventListener("change", (e) => {
          const file = e.target.files && e.target.files[0];
          if (file) handleImportFileSelected(file);
          e.target.value = "";
        });
        $("importMergeBtn").addEventListener("click", () => applyImportedData("merge"));
        $("importOverwriteBtn").addEventListener("click", () => applyImportedData("overwrite"));

        /* Info modal */
        $("infoModalCloseBtn").addEventListener("click", closeInfoModal);
        $("infoModalBackdrop").addEventListener("click", (e) => { if (e.target === e.currentTarget) closeInfoModal(); });
        $("infoModalContent").addEventListener("click", (e) => {
          if (e.target && e.target.id === "openLicenceFromWelcome") openInfoModal("licence");
        });

        /* Confirm modal */
        $("confirmCancelBtn").addEventListener("click", () => settleConfirm(false));
        $("confirmOkBtn").addEventListener("click", () => settleConfirm(true));
        $("confirmModalBackdrop").addEventListener("click", (e) => { if (e.target === e.currentTarget) settleConfirm(false); });

        /* Outside clicks */
        document.addEventListener("click", (e) => {
          if (
            !e.target.closest("#gridMatrixPopover") && !e.target.closest("#cfgGridSizeBtn") &&
            !e.target.closest("#folderCreatorPopover") && !e.target.closest("#addFolderBtn") &&
            !e.target.closest(".folder-action-mini.edit") &&
            !e.target.closest("#moreMenuPopover") && !e.target.closest("#cfgMoreBtn")
          ) {
            closePopovers();
          }
          if (!e.target.closest(".search-wrapper")) $("atCommandsDropdown").classList.remove("open");

          if (
            window.innerWidth <= 720 && state.sidebarExpanded &&
            !e.target.closest("#folderSidebar") && !e.target.closest("#folderCreatorPopover") && !e.target.closest(".modal-backdrop")
          ) {
            state.sidebarExpanded = false;
            savePrefs();
            renderFoldersSidebar();
          }
        });

        /* Keyboard */
        document.addEventListener("keydown", (e) => {
          if (e.key === "Escape") {
            if ($("confirmModalBackdrop").classList.contains("open")) { settleConfirm(false); return; }
            closePopovers();
            $("atCommandsDropdown").classList.remove("open");
            closeBookmarkModal();
            closeIoModal();
            closeInfoModal();
            return;
          }

          // Focus trap в модальных окнах
          if (e.key === "Tab") {
            const open = MODAL_IDS.map($).find((b) => b.classList.contains("open"));
            if (!open) return;
            const f = Array.from(open.querySelectorAll("button:not([disabled]), input:not([disabled]), select")).filter((el) => el.offsetParent !== null);
            if (!f.length) return;
            const first = f[0], last = f[f.length - 1];
            const inside = open.contains(document.activeElement);
            if (e.shiftKey && (!inside || document.activeElement === first)) { e.preventDefault(); last.focus(); }
            else if (!e.shiftKey && (!inside || document.activeElement === last)) { e.preventDefault(); first.focus(); }
            return;
          }

          if (anyModalOpen()) return;

          const tag = e.target.tagName;
          const typing = tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT" || e.target.isContentEditable;
          const mod = e.ctrlKey || e.metaKey;

          if (mod && !e.altKey && e.key.toLowerCase() === "k") {
            e.preventDefault();
            focusSearch(true);
            return;
          }
          if (typing) return;

          if (mod && !e.altKey) {
            const k = e.key.toLowerCase();
            if (k === "z" && !e.shiftKey) { e.preventDefault(); undo(); return; }
            if ((k === "z" && e.shiftKey) || k === "y") { e.preventDefault(); redo(); return; }
          }
          if (e.key === "/" && !mod && !e.altKey) {
            e.preventDefault();
            focusSearch(false);
            return;
          }
          if (e.key === "ArrowRight") stepCarouselPage(1);
          else if (e.key === "ArrowLeft") stepCarouselPage(-1);
        });

        bindCarouselGestures();

        let resizeTimer;
        const onResize = () => {
          clearTimeout(resizeTimer);
          resizeTimer = setTimeout(renderBookmarksStage, 90);
        };
        window.addEventListener("resize", onResize);
        window.addEventListener("orientationchange", onResize);

        /* Синхронизация между вкладками */
        window.addEventListener("storage", (e) => {
          if (e.storageArea && e.storageArea !== window.localStorage) return;
          let changed = false;
          if (e.key === null || e.key === DATA_KEY) {
            const d = loadData();
            state.folders = d.folders;
            state.hasUnsavedExport = d.dirty;
            if (!state.folders.some((f) => f.id === state.activeFolderId)) state.activeFolderId = state.folders[0].id;
            undoStack = [];   // снимки устарели
            redoStack = [];
            changed = true;
            showToast(t("syncedFromOtherTab"));
          }
          if (e.key === null || e.key === PREFS_KEY) {
            const p = loadPrefs();
            PREF_KEYS.forEach((k) => { state[k] = p[k]; });
            changed = true;
          }
          if (changed) renderAll();
        });
      }

      /* =====================================================================
         BOOT
         ===================================================================== */
      bindEvents();
      renderAll();

      if (corruptDetected) showToast(t("corruptNotice"), { duration: 9000 });
      else if (initialData.skipped) showToast(t("skippedInvalid", initialData.skipped), { duration: 5000 });

      if (navigator.storage && navigator.storage.persist) {
        navigator.storage.persist().catch(() => {});
      }

      if (!state.welcomeShown) openInfoModal("welcome");
      else if (!COARSE.matches) $("globalSearchInput").focus();
    })();
  </script>
</body>
</html>
