      /* =====================================================================
         UTILITIES: ids, escape, URL sanitising, tags
         ===================================================================== */
      function uid(prefix) {
        try {
          if (window.crypto && crypto.randomUUID) return prefix + "_" + crypto.randomUUID().slice(0, 12);
        } catch (_e) {}
        return prefix + "_" + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
      }

      function escapeHtml(str) {
        return String(str == null ? "" : str)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      function clip(str, max) {
        return String(str == null ? "" : str).trim().slice(0, max);
      }

      /* Возвращает безопасный абсолютный URL либо null.
         Поддерживает host:port (localhost:3000), локальные адреса получают http://. */
      function sanitizeUrl(raw) {
        let s = String(raw == null ? "" : raw).replace(/[\u0000-\u001f\u007f]/g, "").trim();
        if (!s) return null;
        let candidate;
        const m = /^([a-zA-Z][a-zA-Z0-9+.-]*):(\/\/)?/.exec(s);
        if (m && (m[2] || /^(mailto|tel|javascript|data|vbscript|file|blob|about)$/i.test(m[1]))) {
          candidate = s;
        } else {
          const hostPart = s.split(/[\/?#]/)[0].replace(/:\d+$/, "").toLowerCase();
          const isLocal =
            hostPart === "localhost" ||
            /^\d{1,3}(\.\d{1,3}){3}$/.test(hostPart) ||
            /^\[[0-9a-f:]+\]$/.test(hostPart) ||
            /\.(local|lan|home|internal|localdomain)$/.test(hostPart) ||
            (hostPart && hostPart.indexOf(".") === -1);
          candidate = (isLocal ? "http://" : "https://") + s;
        }
        try {
          const u = new URL(candidate);
          if (ALLOWED_PROTOCOLS.indexOf(u.protocol) === -1) return null;
          if ((u.protocol === "http:" || u.protocol === "https:" || u.protocol === "ftp:") && !u.hostname) return null;
          return candidate;
        } catch (_e) {
          return null;
        }
      }

      function safeHref(url) {
        return sanitizeUrl(url) || "#";
      }

      function sanitizeIconUrl(raw) {
        const s = String(raw == null ? "" : raw).trim();
        if (!s || s.toLowerCase() === "<favicon>") return "<favicon>";
        if (/^data:image\/(png|jpeg|gif|webp|svg\+xml|x-icon|vnd\.microsoft\.icon);/i.test(s)) return s;
        const u = sanitizeUrl(s);
        return u && /^https?:/i.test(u) ? u : "<favicon>";
      }

      function hostOf(url) {
        try {
          return new URL(url).hostname.replace(/^www\./, "");
        } catch (_e) {
          return "";
        }
      }

      function getFaviconFromUrl(siteUrl) {
        try {
          const u = new URL(siteUrl);
          if (u.protocol !== "http:" && u.protocol !== "https:") return "";
          return `${u.origin}/favicon.ico`;
        } catch (_e) {
          return "";
        }
      }

      function resolveBookmarkIcon(bookmark) {
        const custom = String(bookmark.iconUrl || "").trim();
        if (custom && custom.toLowerCase() !== "<favicon>") return custom;
        return getFaviconFromUrl(bookmark.url);
      }

      /* Теги: нижний регистр, без дублей и пустых, максимум 20 */
      function parseTags(rawTags) {
        const parts = Array.isArray(rawTags)
          ? rawTags.map((x) => String(x))
          : String(rawTags || "").split(/[\s,;]+/);
        const out = [];
        const seen = new Set();
        parts.forEach((p) => {
          const body = p.trim().replace(/^#+/, "").toLocaleLowerCase().slice(0, 32);
          if (!body) return;
          const tag = "#" + body;
          if (seen.has(tag)) return;
          seen.add(tag);
          out.push(tag);
        });
        return out.slice(0, 20);
      }

      function formatTagsBrackets(tags) {
        return `[${parseTags(tags).map((x) => x.replace(/^#+/, "")).join("; ")}]`;
      }

      /* =====================================================================
         STORAGE LAYER (с резервом в памяти и обработкой ошибок)
         ===================================================================== */
      const mem = {};
      const store = {
        get(k) {
          if (Object.prototype.hasOwnProperty.call(mem, k)) return mem[k];
          try { return localStorage.getItem(k); } catch (_e) { return null; }
        },
        set(k, v) {
          try {
            localStorage.setItem(k, v);
            delete mem[k];
            return true;
          } catch (_e) {
            mem[k] = v;
            return false;
          }
        },
        remove(k) {
          try { localStorage.removeItem(k); } catch (_e) {}
          delete mem[k];
        }
      };

      let corruptDetected = false;
      function backupCorrupt(key, raw) {
        corruptDetected = true;
        store.set("bookmarks_corrupt_backup_" + Date.now() + "_" + key, raw);
      }

      function systemLang() {
        const l = (navigator.languages && navigator.languages[0]) || navigator.language || "en";
        return /^ru/i.test(l) ? "ru" : "en";
      }
      function systemTheme() {
        try { return window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark"; } catch (_e) { return "dark"; }
      }

      function defaultPrefs() {
        return {
          sidebarExpanded: false, folderSortLocked: false, gridCols: 3, gridRows: 3,
          viewMode: "grid", theme: systemTheme(), font: "sans", lang: systemLang(),
          welcomeShown: false, lastFolderId: null
        };
      }

      function sanitizePrefs(p) {
        const d = defaultPrefs();
        p = p && typeof p === "object" ? p : {};
        const dim = (v, def) => {
          const n = Math.round(Number(v));
          return Number.isFinite(n) ? Math.min(8, Math.max(1, n)) : def;
        };
        return {
          sidebarExpanded: typeof p.sidebarExpanded === "boolean" ? p.sidebarExpanded : d.sidebarExpanded,
          folderSortLocked: typeof p.folderSortLocked === "boolean" ? p.folderSortLocked : d.folderSortLocked,
          gridCols: dim(p.gridCols, d.gridCols),
          gridRows: dim(p.gridRows, d.gridRows),
          viewMode: p.viewMode === "list" ? "list" : "grid",
          theme: p.theme === "light" || p.theme === "dark" ? p.theme : d.theme,
          font: p.font === "mono" ? "mono" : "sans",
          lang: p.lang === "en" || p.lang === "ru" ? p.lang : d.lang,
          welcomeShown: Boolean(p.welcomeShown),
          lastFolderId: typeof p.lastFolderId === "string" ? p.lastFolderId : null
        };
      }

      function sanitizeFolders(input) {
        const usedF = new Set();
        const usedB = new Set();
        let skipped = 0;
        const folders = [];
        (Array.isArray(input) ? input : []).forEach((f, idx) => {
          if (!f || typeof f !== "object") return;
          let id = String(f.id || "");
          if (!id || usedF.has(id)) id = uid("f");
          usedF.add(id);
          const bookmarks = [];
          (Array.isArray(f.bookmarks) ? f.bookmarks : []).forEach((b) => {
            if (!b || typeof b !== "object") return;
            const url = sanitizeUrl(b.url);
            if (!url) { skipped++; return; }
            let bid = String(b.id || "");
            if (!bid || usedB.has(bid)) bid = uid("b");
            usedB.add(bid);
            bookmarks.push({
              id: bid,
              title: clip(b.title, 120) || hostOf(url) || url,
              url,
              iconUrl: sanitizeIconUrl(b.iconUrl),
              tags: parseTags(b.tags)
            });
          });
          folders.push({
            id,
            name: clip(f.name, 60) || "Folder " + (idx + 1),
            iconIndex: Number.isInteger(f.iconIndex) && f.iconIndex >= 0 && f.iconIndex < ICON_PATHS.length ? f.iconIndex : 1,
            bookmarks
          });
        });
        return { folders, skipped };
      }

      function defaultData() {
        return {
          folders: [{
            id: "f_home", name: "Home", iconIndex: 0,
            bookmarks: [{ id: "b_google", title: "Google", url: "https://google.com", iconUrl: "<favicon>", tags: ["#search", "#web"] }]
          }],
          dirty: false,
          skipped: 0
        };
      }

      function loadData() {
        const raw = store.get(DATA_KEY);
        if (raw) {
          try {
            const p = JSON.parse(raw);
            const res = sanitizeFolders(p && p.folders);
            if (res.folders.length) return { folders: res.folders, dirty: Boolean(p.dirty), skipped: res.skipped };
          } catch (_e) {}
          backupCorrupt(DATA_KEY, raw);
          return defaultData();
        }
        const legacy = store.get(LEGACY_KEY); // миграция со старой версии, исходный ключ не трогаем
        if (legacy) {
          try {
            const p = JSON.parse(legacy);
            const res = sanitizeFolders(p && p.folders);
            if (res.folders.length) return { folders: res.folders, dirty: Boolean(p.hasUnsavedExport), skipped: res.skipped };
          } catch (_e) {}
          backupCorrupt(LEGACY_KEY, legacy);
        }
        return defaultData();
      }

      function loadPrefs() {
        const raw = store.get(PREFS_KEY);
        if (raw) {
          try { return sanitizePrefs(JSON.parse(raw)); } catch (_e) { backupCorrupt(PREFS_KEY, raw); }
          return defaultPrefs();
        }
        const legacy = store.get(LEGACY_KEY);
        if (legacy) {
          try {
            const p = JSON.parse(legacy);
            return sanitizePrefs(Object.assign({}, p, { lastFolderId: p.activeFolderId }));
          } catch (_e) {}
        }
        return defaultPrefs();
      }

      /* =====================================================================
         STATE
         ===================================================================== */
      let state;
      let undoStack = [];
      let redoStack = [];
      let pendingImportData = null;
      let editingBookmarkCtx = null;
      let editingFolderId = null;
      let selectedFolderIcon = 1;
      let dragCtx = null;
      let ddItems = [];
      let ddIndex = -1;
      let confirmResolve = null;
      let storageWarnedAt = 0;

      function buildState(data, prefs) {
        const s = Object.assign({}, prefs, { folders: data.folders, hasUnsavedExport: data.dirty, carouselPage: 0 });
        s.activeFolderId = data.folders.some((f) => f.id === prefs.lastFolderId) ? prefs.lastFolderId : data.folders[0].id;
        return s;
      }

      const initialData = loadData();
      const initialPrefs = loadPrefs();
      state = buildState(initialData, initialPrefs);

      function t(key, ...args) {
        const dict = I18N[state.lang] || I18N.en;
        const val = dict[key];
        return typeof val === "function" ? val(...args) : (val || key);
      }

      function showToast(msg, opts = {}) {
        const el = $("toastBar");
        const act = $("toastAction");
        $("toastText").textContent = msg;
        if (opts.actionLabel && opts.onAction) {
          act.textContent = opts.actionLabel;
          act.hidden = false;
          act.onclick = () => {
            el.classList.remove("show", "has-action");
            opts.onAction();
          };
          el.classList.add("has-action");
        } else {
          act.hidden = true;
          act.onclick = null;
          el.classList.remove("has-action");
        }
        el.classList.add("show");
        clearTimeout(showToast._timer);
        showToast._timer = setTimeout(() => el.classList.remove("show", "has-action"), opts.duration || (opts.onAction ? 5000 : 2600));
      }

      function writeKey(key, obj) {
        const ok = store.set(key, JSON.stringify(obj));
        if (!ok && Date.now() - storageWarnedAt > 8000) {
          storageWarnedAt = Date.now();
          showToast(t("storageError"), { duration: 7000 });
        }
        return ok;
      }

      function saveData(markDirty = true) {
        if (markDirty) state.hasUnsavedExport = true;
        writeKey(DATA_KEY, { version: DATA_VERSION, folders: state.folders, dirty: state.hasUnsavedExport });
        syncDirtyIndicator();
        syncUndoButton();
      }

      function savePrefs() {
        const o = {};
        PREF_KEYS.forEach((k) => { o[k] = state[k]; });
        o.lastFolderId = state.activeFolderId;
        writeKey(PREFS_KEY, o);
      }

      /* Undo / Redo: снимки папок */
      function snapshot() {
        return JSON.stringify({ f: state.folders, a: state.activeFolderId });
      }
      function restoreSnapshot(str) {
        const s = JSON.parse(str);
        state.folders = s.f;
        state.activeFolderId = state.folders.some((f) => f.id === s.a) ? s.a : state.folders[0].id;
        state.carouselPage = 0;
      }
      function pushUndo() {
        undoStack.push(snapshot());
        if (undoStack.length > MAX_UNDO) undoStack.shift();
        redoStack.length = 0;
      }
      function mutate(fn) {
        pushUndo();
        fn();
        saveData(true);
        renderAll();
      }
      function undo() {
        if (!undoStack.length) { showToast(t("nothingToUndo")); return; }
        redoStack.push(snapshot());
        restoreSnapshot(undoStack.pop());
        saveData(true);
        savePrefs();
        renderAll();
        showToast(t("undoDone"));
      }
      function redo() {
        if (!redoStack.length) { showToast(t("nothingToRedo")); return; }
        undoStack.push(snapshot());
        restoreSnapshot(redoStack.pop());
        saveData(true);
        savePrefs();
        renderAll();
        showToast(t("redoDone"));
      }

      function syncUndoButton() {
        const btn = $("cfgUndoBtn");
        const has = undoStack.length > 0;
        btn.classList.toggle("undo-dimmed", !has);
        btn.classList.toggle("undo-active", has);
        btn.setAttribute("aria-disabled", String(!has));
      }

      function syncDirtyIndicator() {
        $("cfgIoBtn").classList.toggle("unsaved-dirty", Boolean(state.hasUnsavedExport));
      }

      /* =====================================================================
         MODALS (focus management)
         ===================================================================== */
      const MODAL_IDS = ["bookmarkModalBackdrop", "ioModalBackdrop", "infoModalBackdrop", "confirmModalBackdrop"];

      function openModal(id, focusId) {
        const b = $(id);
        if (!b.classList.contains("open")) b._ret = document.activeElement;
        b.classList.add("open");
        const f = focusId ? $(focusId) : b.querySelector("button, input, select");
        setTimeout(() => { if (f) f.focus(); }, 30);
      }
      function hideModal(id) {
        const b = $(id);
        if (!b.classList.contains("open")) return false;
        b.classList.remove("open");
        const r = b._ret;
        b._ret = null;
        if (r && document.contains(r) && typeof r.focus === "function") r.focus();
        return true;
      }
      function anyModalOpen() {
        return MODAL_IDS.some((id) => $(id).classList.contains("open"));
      }

      function askConfirm({ title, text, okLabel, danger = true }) {
        return new Promise((resolve) => {
          if (confirmResolve) confirmResolve(false);
          confirmResolve = resolve;
          $("confirmTitle").textContent = title;
          $("confirmText").textContent = text;
          const ok = $("confirmOkBtn");
          ok.textContent = okLabel || t("confirm");
          ok.className = danger ? "btn-danger" : "btn-filled";
          openModal("confirmModalBackdrop", "confirmCancelBtn");
        });
      }
      function settleConfirm(value) {
        if (!confirmResolve) return;
        const r = confirmResolve;
        confirmResolve = null;
        hideModal("confirmModalBackdrop");
        r(value);
      }

      /* =====================================================================
         GRID MEASURING
         Карточка имеет ширину CARD_DEFAULT_W (280px) и уменьшается только если
         не влезает в ширину доступного пространства окна/колонки.
         ===================================================================== */
      function getMinCardWidthForFolder(bookmarks) {
        return CARD_DEFAULT_W;
      }

      function measureGrid(bookmarks) {
        const stage = $("bookmarksStage");
        const w = stage ? stage.clientWidth : window.innerWidth;
        const h = (stage ? stage.clientHeight : window.innerHeight) - GRID_TOP_PAD;
        const isMobile = window.innerWidth <= 720;
        const minCols = isMobile ? 1 : 3;
        const fittingCols = Math.max(1, Math.floor((w + GRID_GAP) / (CARD_DEFAULT_W + GRID_GAP)));
        const actualCols = Math.min(8, Math.max(minCols, fittingCols));
        const availableColW = Math.max(80, Math.floor((w - GRID_GAP * (actualCols - 1)) / actualCols));
        const minCardW = Math.min(CARD_DEFAULT_W, availableColW);
        return {
          minCols,
          minRows: 3,
          minCardW,
          maxFitCols: actualCols,
          maxFitRows: Math.max(1, Math.floor((h + GRID_GAP) / (84 + GRID_GAP)))
        };
      }

      function getGridLimits(bookmarks) {
        const m = measureGrid(bookmarks);
        return {
          minC: Math.min(m.minCols, m.maxFitCols),
          minR: Math.min(m.minRows, m.maxFitRows),
          maxC: Math.min(8, m.maxFitCols),
          maxR: Math.min(8, m.maxFitRows),
          minCardW: m.minCardW
        };
      }

      function getEffectiveGridDimensions(bookmarks = []) {
        const l = getGridLimits(bookmarks);
        const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
        return {
          cols: clamp(Number(state.gridCols) || l.minC, l.minC, l.maxC),
          rows: clamp(Number(state.gridRows) || l.minR, l.minR, l.maxR),
          minCardW: l.minCardW
        };
      }

      /* =====================================================================
         FAVICONS (запасная иконка-аватар)
         ===================================================================== */
      function hashHue(s) {
        let h = 0;
        for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
        return h % 360;
      }

      function createFavicon(bm, size) {
        const wrap = document.createElement("span");
        wrap.className = "fav fav-" + size;
        const host = hostOf(bm.url);

        const showFallback = () => {
          wrap.textContent = "";
          const d = document.createElement("span");
          d.className = "fav-fallback";
          const m = String(bm.title || host || "?").trim().match(/[\p{L}\p{N}]/u);
          d.textContent = (m ? m[0] : "?").toUpperCase();
          d.style.backgroundColor = `hsl(${hashHue(host || bm.title || "")} 52% 40%)`;
          wrap.appendChild(d);
        };

        const primary = resolveBookmarkIcon(bm);
        const fallback = getFaviconFromUrl(bm.url);
        if (!primary && !fallback) {
          showFallback();
          return wrap;
        }

        const img = new Image();
        let triedFallback = false;
        img.alt = "";
        img.loading = "lazy";
        img.decoding = "async";
        img.referrerPolicy = "no-referrer";
        img.onerror = () => {
          if (!triedFallback && fallback && img.src !== fallback) {
            triedFallback = true;
            img.src = fallback;
          } else {
            showFallback();
          }
        };
        img.onload = () => {
          const n = img.naturalWidth;
          if (n && n <= 24) {
            const k = Math.max(1, Math.floor(FAV_BOX[size] / n));
            img.style.width = img.style.height = n * k + "px";
            img.style.imageRendering = k > 1 ? "pixelated" : "auto";
          }
        };
        img.src = primary || fallback;
        wrap.appendChild(img);
        return wrap;
      }

      /* =====================================================================
         TOUCH GESTURES: long-press drag-reorder + swipe
         ===================================================================== */
      function bindTouchGestures(root, opts) {
        let s = null;
        const canDrag = opts.canDrag || (() => true);

        root.addEventListener("touchstart", (e) => {
          if (e.touches.length !== 1) { s = null; return; }
          const tch = e.touches[0];
          const item = e.target.closest(opts.itemSel);
          s = { x: tch.clientX, y: tch.clientY, item, drag: false, timer: null, over: null };
          if (item && canDrag() && !e.target.closest(".bookmark-actions, .list-actions, .folder-item-actions, .tag-chip")) {
            s.timer = setTimeout(() => {
              if (!s) return;
              s.drag = true;
              item.classList.add("dragging");
              if (navigator.vibrate) { try { navigator.vibrate(12); } catch (_e) {} }
            }, 400);
          }
        }, { passive: true });

        root.addEventListener("touchmove", (e) => {
          if (!s) return;
          const tch = e.touches[0];
          if (!s.drag) {
            if (Math.hypot(tch.clientX - s.x, tch.clientY - s.y) > 10) clearTimeout(s.timer);
            return;
          }
          e.preventDefault();
          const el = document.elementFromPoint(tch.clientX, tch.clientY);
          const tgt = el && el.closest(opts.itemSel);
          if (s.over && s.over !== tgt) s.over.classList.remove("drag-over");
          s.over = tgt && tgt !== s.item ? tgt : null;
          if (s.over) s.over.classList.add("drag-over");
        }, { passive: false });

        root.addEventListener("touchend", (e) => {
          if (!s) return;
          clearTimeout(s.timer);
          const st = s;
          s = null;
          if (st.drag) {
            e.preventDefault();
            st.item.classList.remove("dragging");
            if (st.over) {
              st.over.classList.remove("drag-over");
              opts.onReorder(st.item.dataset.id, st.over.dataset.id);
            }
            return;
          }
          if (opts.onSwipe && e.changedTouches.length) {
            const tch = e.changedTouches[0];
            const dx = tch.clientX - st.x;
            const dy = tch.clientY - st.y;
            if (Math.abs(dx) > 48 && Math.abs(dx) > Math.abs(dy) * 1.2) {
              e.preventDefault();
              opts.onSwipe(dx < 0 ? 1 : -1);
            }
          }
        }, { passive: false });

        root.addEventListener("touchcancel", () => {
          if (!s) return;
          clearTimeout(s.timer);
          if (s.item) s.item.classList.remove("dragging");
          if (s.over) s.over.classList.remove("drag-over");
          s = null;
        });

        root.addEventListener("contextmenu", (e) => {
          if (s && s.drag) e.preventDefault();
        });
      }

      /* =====================================================================
         FOLDERS SIDEBAR
         ===================================================================== */
      function syncLockSortButton() {
        const btn = $("lockSortBtn");
        const iconSlot = $("lockSortIconSlot");
        btn.classList.toggle("locked", Boolean(state.folderSortLocked));
        const label = btn.querySelector(".lock-sort-label");
        if (state.folderSortLocked) {
          iconSlot.innerHTML = renderSvgIcon(21);
          label.textContent = t("unlockSort");
          btn.title = t("unlockSort");
        } else {
          iconSlot.innerHTML = renderSvgIcon(22);
          label.textContent = t("lockSort");
          btn.title = t("lockSort");
        }
        btn.setAttribute("aria-pressed", String(Boolean(state.folderSortLocked)));
      }

      function reorderFolders(srcId, dstId) {
        if (state.folderSortLocked || !srcId || !dstId || srcId === dstId) return;
        const fromIdx = state.folders.findIndex((f) => f.id === srcId);
        const toIdx = state.folders.findIndex((f) => f.id === dstId);
        if (fromIdx === -1 || toIdx === -1) return;
        mutate(() => {
          const [moved] = state.folders.splice(fromIdx, 1);
          state.folders.splice(toIdx, 0, moved);
        });
      }

      function moveBookmarkToFolder(fromFolderId, bmId, toFolderId) {
        if (fromFolderId === toFolderId) return;
        const from = state.folders.find((f) => f.id === fromFolderId);
        const to = state.folders.find((f) => f.id === toFolderId);
        if (!from || !to) return;
        const idx = from.bookmarks.findIndex((b) => b.id === bmId);
        if (idx === -1) return;
        mutate(() => {
          const [bm] = from.bookmarks.splice(idx, 1);
          to.bookmarks.push(bm);
        });
        showToast(t("bookmarkMoved", to.name), { actionLabel: t("undo"), onAction: undo });
      }

      function selectFolder(folderId) {
        state.activeFolderId = folderId;
        state.carouselPage = 0;
        const searchInput = $("globalSearchInput");
        if (searchInput.value.trim()) {
          searchInput.value = "";
          $("clearSearchBtn").classList.remove("visible");
          ddIndex = -1;
        }
        if (window.innerWidth <= 720 && state.sidebarExpanded) state.sidebarExpanded = false;
        savePrefs();
        renderAll();
      }

      function renderFoldersSidebar() {
        const sidebar = $("folderSidebar");
        sidebar.classList.toggle("expanded", Boolean(state.sidebarExpanded));
        syncLockSortButton();

        const listEl = $("folderList");
        listEl.innerHTML = "";
        const html5Drag = !COARSE.matches;

        state.folders.forEach((folder) => {
          const isActive = folder.id === state.activeFolderId;
          const row = document.createElement("div");
          row.className = "folder-row" + (isActive ? " active" : "");
          row.dataset.id = folder.id;
          row.draggable = html5Drag && !state.folderSortLocked;

          row.innerHTML = `
            <button type="button" class="folder-item" title="${escapeHtml(folder.name)}" ${isActive ? 'aria-current="true"' : ""}>
              ${renderSvgIcon(folder.iconIndex, "icon-svg")}
              <span class="folder-item-label">${escapeHtml(folder.name)}</span>
              <span class="folder-item-count">${folder.bookmarks.length}</span>
            </button>
            <span class="folder-item-actions">
              <button type="button" class="folder-action-mini edit" title="${escapeHtml(t("editFolderTitle"))}" aria-label="${escapeHtml(t("editFolderTitle"))}">
                ${PENCIL_SVG}
              </button>
              <button type="button" class="folder-action-mini del" title="${escapeHtml(t("deleteFolderTitle"))}" aria-label="${escapeHtml(t("deleteFolderTitle"))}">
                <svg class="icon-svg-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
              </button>
            </span>
          `;

          row.querySelector(".folder-item").addEventListener("click", () => selectFolder(folder.id));
          row.querySelector(".edit").addEventListener("click", (e) => {
            e.stopPropagation();
            openFolderPopover(folder, e.currentTarget);
          });
          row.querySelector(".del").addEventListener("click", (e) => {
            e.stopPropagation();
            deleteFolder(folder.id);
          });

          row.addEventListener("dragstart", (e) => {
            if (state.folderSortLocked) { e.preventDefault(); return; }
            dragCtx = { kind: "folder", id: folder.id };
            row.classList.add("dragging");
            if (e.dataTransfer) {
              e.dataTransfer.effectAllowed = "move";
              e.dataTransfer.setData("text/plain", folder.id);
            }
          });
          row.addEventListener("dragend", () => {
            dragCtx = null;
            row.classList.remove("dragging");
            listEl.querySelectorAll(".folder-row").forEach((el) => el.classList.remove("drag-over"));
          });
          row.addEventListener("dragover", (e) => {
            if (!dragCtx) return;
            if (dragCtx.kind === "folder") {
              if (state.folderSortLocked || dragCtx.id === folder.id) return;
            } else if (dragCtx.folderId === folder.id) {
              return;
            }
            e.preventDefault();
            row.classList.add("drag-over");
          });
          row.addEventListener("dragleave", () => row.classList.remove("drag-over"));
          row.addEventListener("drop", (e) => {
            e.preventDefault();
            row.classList.remove("drag-over");
            const ctx = dragCtx;
            dragCtx = null;
            if (!ctx) return;
            if (ctx.kind === "folder") reorderFolders(ctx.id, folder.id);
            else moveBookmarkToFolder(ctx.folderId, ctx.id, folder.id);
          });

          listEl.appendChild(row);
        });
      }

      async function deleteFolder(folderId) {
        if (state.folders.length <= 1) {
          showToast(t("cannotDeleteLast"));
          return;
        }
        const folder = state.folders.find((f) => f.id === folderId);
        if (!folder) return;
        const ok = await askConfirm({
          title: t("confirmDeleteFolderTitle"),
          text: t("confirmDeleteFolderText", folder.name, folder.bookmarks.length),
          okLabel: t("delete")
        });
        if (!ok) return;
        mutate(() => {
          state.folders = state.folders.filter((f) => f.id !== folderId);
          if (state.activeFolderId === folderId) state.activeFolderId = state.folders[0].id;
          state.carouselPage = 0;
        });
        savePrefs();
        showToast(t("folderDeleted"), { actionLabel: t("undo"), onAction: undo });
      }

      /* =====================================================================
         SEARCH: tokenizer, filters, suggestions, @-commands
         Семантика: несколько #тегов и слов — «И»; несколько /папок или .доменов — «ИЛИ».
         Слова ищутся в названии и URL. .домен сравнивается по границам меток
         (.ru НЕ находит rutracker.org; .google находит mail.google.com).
         Для папок/фраз с пробелами используйте кавычки: /"My Folder", "two words".
         ===================================================================== */
      function tokenizeQuery(q) {
        const tokens = [];
        const re = /([\/#.]?)"([^"]*)"?|(\S+)/g;
        let m;
        while ((m = re.exec(q)) !== null) {
          let prefix, text;
          if (m[3] !== undefined) {
            const w = m[3];
            if (/^[\/#.]/.test(w)) { prefix = w[0]; text = w.slice(1); } else { prefix = ""; text = w; }
          } else {
            prefix = m[1];
            text = m[2];
          }
          text = text.trim();
          if (!text) continue;
          tokens.push({ prefix, text: text.toLowerCase() });
        }
        return tokens;
      }

      function runGlobalSearch(rawQuery) {
        const q = rawQuery.trim();
        if (!q || q.startsWith("@")) return null;

        const terms = [], domains = [], tags = [], folders = [];
        tokenizeQuery(q).forEach((tk) => {
          if (tk.prefix === ".") domains.push(tk.text);
          else if (tk.prefix === "#") tags.push(tk.text);
          else if (tk.prefix === "/") folders.push(tk.text);
          else terms.push(tk.text);
        });

        const matches = [];
        state.folders.forEach((folder) => {
          const fl = folder.name.toLowerCase();
          if (folders.length && !folders.some((f) => fl.includes(f))) return;

          folder.bookmarks.forEach((bm) => {
            const titleL = bm.title.toLowerCase();
            const urlL = bm.url.toLowerCase();

            if (domains.length) {
              let host = "";
              try { host = new URL(bm.url).hostname.toLowerCase(); } catch (_e) {}
              const padded = "." + host + ".";
              if (!domains.some((d) => padded.includes("." + d + "."))) return;
            }
            if (tags.length) {
              const bmTags = parseTags(bm.tags);
              if (!tags.every((rt) => bmTags.some((tg) => tg.includes(rt)))) return;
            }
            if (terms.length && !terms.every((term) => titleL.includes(term) || urlL.includes(term))) return;

            matches.push({ folder, bookmark: bm });
          });
        });

        return {
          matches,
          terms,
          plainOnly: terms.length > 0 && !domains.length && !tags.length && !folders.length
        };
      }

      function appendHighlighted(el, text, terms) {
        if (!terms.length) { el.textContent = text; return; }
        const lower = text.toLowerCase();
        let ranges = [];
        terms.forEach((term) => {
          let i = lower.indexOf(term);
          while (i !== -1) {
            ranges.push([i, i + term.length]);
            i = lower.indexOf(term, i + term.length);
          }
        });
        if (!ranges.length) { el.textContent = text; return; }
        ranges.sort((a, b) => a[0] - b[0]);
        const merged = [ranges[0]];
        for (let i = 1; i < ranges.length; i++) {
          const last = merged[merged.length - 1];
          if (ranges[i][0] <= last[1]) last[1] = Math.max(last[1], ranges[i][1]);
          else merged.push(ranges[i]);
        }
        let pos = 0;
        merged.forEach(([a, b]) => {
          if (a > pos) el.appendChild(document.createTextNode(text.slice(pos, a)));
          const mark = document.createElement("mark");
          mark.textContent = text.slice(a, b);
          el.appendChild(mark);
          pos = b;
        });
        if (pos < text.length) el.appendChild(document.createTextNode(text.slice(pos)));
      }

      function getMatchingAtCommands(rawVal) {
        const trimmedStart = rawVal.replace(/^\s+/, "");
        if (!trimmedStart.startsWith("@")) return [];
        const firstToken = trimmedStart.split(/\s+/)[0].toLowerCase();
        return AT_COMMANDS.filter((item) => item.cmd.startsWith(firstToken));
      }

      function getLastToken(v) {
        if (!v || /\s$/.test(v)) return null;
        const quotes = (v.match(/"/g) || []).length;
        if (quotes % 2 === 1) {
          const qi = v.lastIndexOf('"');
          let start = qi;
          if (qi > 0 && /[\/#.]/.test(v[qi - 1])) start = qi - 1;
          return { start, text: v.slice(start) };
        }
        const m = /(\S+)$/.exec(v);
        return m ? { start: m.index, text: m[1] } : null;
      }

      function getFilterSuggestions(value) {
        const tok = getLastToken(value);
        if (!tok || !/^[#\/.]/.test(tok.text)) return [];
        const kind = tok.text[0];
        const prefix = tok.text.slice(1).replace(/^"/, "").replace(/"$/, "").toLowerCase();
        const counts = new Map();
        const bump = (k) => counts.set(k, (counts.get(k) || 0) + 1);

        if (kind === "#") {
          state.folders.forEach((f) => f.bookmarks.forEach((b) => parseTags(b.tags).forEach((tg) => bump(tg))));
          return [...counts.entries()]
            .filter(([tg]) => tg.slice(1).startsWith(prefix) && tg.slice(1) !== prefix)
            .sort((a, b) => b[1] - a[1]).slice(0, 8)
            .map(([tg, n]) => ({ kind: "sugg", text: tg, insert: tg, desc: String(n) }));
        }
        if (kind === "/") {
          return state.folders
            .filter((f) => f.name.toLowerCase().startsWith(prefix) && f.name.toLowerCase() !== prefix)
            .slice(0, 8)
            .map((f) => ({
              kind: "sugg", text: "/" + f.name,
              insert: /\s/.test(f.name) ? `/"${f.name}"` : "/" + f.name,
              desc: t("bookmarkCount", f.bookmarks.length)
            }));
        }
        state.folders.forEach((f) => f.bookmarks.forEach((b) => {
          const labels = hostOf(b.url).toLowerCase().split(".").filter(Boolean);
          if (!labels.length) return;
          const set = new Set();
          labels.forEach((l) => set.add("." + l));
          if (labels.length >= 2) set.add("." + labels.slice(-2).join("."));
          set.forEach((d) => bump(d));
        }));
        return [...counts.entries()]
          .filter(([d]) => d.slice(1).startsWith(prefix) && d.slice(1) !== prefix)
          .sort((a, b) => b[1] - a[1]).slice(0, 8)
          .map(([d, n]) => ({ kind: "sugg", text: d, insert: d, desc: String(n) }));
      }

      function renderDropdown() {
        const input = $("globalSearchInput");
        const drop = $("atCommandsDropdown");
        const cmds = getMatchingAtCommands(input.value);
        ddItems = cmds.length
          ? cmds.map((c) => ({ kind: "cmd", text: c.cmd, desc: state.lang === "ru" ? c.descRu : c.descEn }))
          : getFilterSuggestions(input.value);
        if (ddIndex >= ddItems.length) ddIndex = -1;

        if (!ddItems.length) {
          drop.classList.remove("open");
          drop.innerHTML = "";
          return;
        }
        drop.innerHTML = "";
        ddItems.forEach((item, i) => {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.tabIndex = -1;
          btn.setAttribute("role", "option");
          btn.className = "at-command-item" + (i === ddIndex ? " selected" : "");
          btn.setAttribute("aria-selected", String(i === ddIndex));
          const name = document.createElement("span");
          name.className = "at-cmd-name";
          name.textContent = item.text;
          const desc = document.createElement("span");
          desc.className = "at-cmd-desc";
          desc.textContent = item.desc;
          btn.append(name, desc);
          btn.addEventListener("mousedown", (e) => e.preventDefault()); // не терять фокус поля
          btn.addEventListener("click", () => applyDropdownItem(item, false));
          drop.appendChild(btn);
        });
        drop.classList.add("open");
      }

      function applyDropdownItem(item, fillOnly) {
        const input = $("globalSearchInput");
        if (item.kind === "cmd") {
          input.value = item.text;
          $("clearSearchBtn").classList.add("visible");
          if (fillOnly) { ddIndex = -1; renderDropdown(); input.focus(); return; }
          $("atCommandsDropdown").classList.remove("open");
          executeSearchCommand(item.text);
          return;
        }
        const tok = getLastToken(input.value);
        if (!tok) return;
        input.value = input.value.slice(0, tok.start) + item.insert + " ";
        $("clearSearchBtn").classList.add("visible");
        ddIndex = -1;
        renderDropdown();
        renderBookmarksStage();
        input.focus();
      }

      function resetSearchInput() {
        const input = $("globalSearchInput");
        input.value = "";
        $("clearSearchBtn").classList.remove("visible");
        ddIndex = -1;
        renderDropdown();
        renderBookmarksStage();
      }

      function executeSearchCommand(rawQuery) {
        const cmd = rawQuery.trim().toLowerCase();
        switch (cmd) {
          case "@export": resetSearchInput(); exportStateToJson(); return true;
          case "@import": resetSearchInput(); openIoModal(); $("importFileInput").click(); return true;
          case "@clear": resetSearchInput(); requestClear(); return true;
          case "@undo": resetSearchInput(); undo(); return true;
          case "@licence":
          case "@license": resetSearchInput(); openInfoModal("licence"); return true;
          case "@welcome": resetSearchInput(); openInfoModal("welcome"); return true;
          default: return false;
        }
      }

      async function requestClear() {
        const ok = await askConfirm({
          title: t("confirmClearTitle"),
          text: t("confirmClearText"),
          okLabel: t("confirmClearOk")
        });
        if (!ok) return;
        store.remove(DATA_KEY);
        store.remove(PREFS_KEY);
        store.remove(LEGACY_KEY);
        undoStack = [];
        redoStack = [];
        state = buildState(defaultData(), defaultPrefs());
        saveData(false);
        savePrefs();
        showToast(t("clearedOk"));
        renderAll();
        openInfoModal("welcome");
      }

      function openFirstSearchResult() {
        const query = $("globalSearchInput").value;
        const res = runGlobalSearch(query);
        if (!res) return;
        if (res.matches.length) {
          window.open(safeHref(res.matches[0].bookmark.url), "_blank", "noopener,noreferrer");
        } else if (res.plainOnly) {
          showToast(t("openingWebSearch"));
          window.open(FALLBACK_SEARCH_URL + encodeURIComponent(query.trim()), "_blank", "noopener,noreferrer");
        } else {
          showToast(t("emptySearch"));
        }
      }

      function applyTagFilterToSearch(tagStr) {
        const input = $("globalSearchInput");
        const cleanTag = tagStr.startsWith("#") ? tagStr : "#" + tagStr;
        const current = input.value.trim();
        if (!current) input.value = cleanTag;
        else if (!current.split(/\s+/).includes(cleanTag)) input.value = current + " " + cleanTag;
        $("clearSearchBtn").classList.toggle("visible", input.value.length > 0);
        ddIndex = -1;
        renderDropdown();
        renderBookmarksStage();
      }

      /* =====================================================================
         BOOKMARKS STAGE
         ===================================================================== */
      function renderCarouselFooter(totalPages, currentPage) {
        const dotsEl = $("carouselIndicator");
        dotsEl.innerHTML = "";
        if (totalPages <= 1) return;
        for (let p = 0; p < totalPages; p++) {
          const dot = document.createElement("button");
          dot.type = "button";
          dot.className = "carousel-dot" + (p === currentPage ? " active" : "");
          dot.setAttribute("aria-label", t("pageOf", p + 1, totalPages));
          dot.addEventListener("click", () => {
            state.carouselPage = p;
            renderBookmarksStage();
          });
          dotsEl.appendChild(dot);
        }
      }

      function reorderBookmarksInFolder(folderId, draggedId, targetId) {
        if (!draggedId || !targetId || draggedId === targetId) return;
        const folder = state.folders.find((f) => f.id === folderId);
        if (!folder) return;
        const fromIdx = folder.bookmarks.findIndex((b) => b.id === draggedId);
        const toIdx = folder.bookmarks.findIndex((b) => b.id === targetId);
        if (fromIdx === -1 || toIdx === -1) return;
        mutate(() => {
          const [moved] = folder.bookmarks.splice(fromIdx, 1);
          folder.bookmarks.splice(toIdx, 0, moved);
        });
      }

      function createTagChip(tg, idx, stopLink) {
        const chip = document.createElement("button");
        chip.type = "button";
        chip.className = `tag-chip c${idx % 4}`;
        chip.textContent = tg;
        chip.addEventListener("click", (e) => {
          if (stopLink) { e.preventDefault(); e.stopPropagation(); }
          applyTagFilterToSearch(tg);
        });
        return chip;
      }

      /* Теги, не поместившиеся в два ряда, скрываются; вместо них — счётчик «+N» */
      function fitTagChips(cloud) {
        const chips = Array.from(cloud.querySelectorAll(".tag-chip:not(.tag-more)"));
        if (!chips.length) return;
        const more = document.createElement("span");
        more.className = "tag-chip tag-more";
        more.style.display = "none";
        cloud.appendChild(more);
        const over = () => cloud.scrollHeight > cloud.clientHeight + 1;
        let hidden = 0;
        while (over() && hidden < chips.length) {
          chips[chips.length - 1 - hidden].style.display = "none";
          hidden++;
          more.textContent = "+" + hidden;
          more.style.display = "";
        }
        if (hidden) {
          const names = chips.slice(chips.length - hidden).map((c) => c.textContent).join(" ");
          more.title = t("moreTags", names);
        }
      }

      function buildBookmarkActionButtons(folderId, bookmark, variant) {
        const wrap = document.createElement("div");
        wrap.className = variant === "list" ? "list-actions" : "bookmark-actions";

        const editBtn = document.createElement("button");
        editBtn.type = "button";
        editBtn.className = "mini-icon-btn";
        editBtn.title = t("editBookmarkTitle");
        editBtn.setAttribute("aria-label", t("editBookmarkTitle"));
        editBtn.innerHTML = PENCIL_SVG;
        editBtn.addEventListener("click", (e) => {
          e.preventDefault();
          e.stopPropagation();
          openBookmarkModal(folderId, bookmark);
        });

        const delBtn = document.createElement("button");
        delBtn.type = "button";
        delBtn.className = "mini-icon-btn del";
        delBtn.title = t("deleteBookmarkTitle");
        delBtn.setAttribute("aria-label", t("deleteBookmarkTitle"));
        delBtn.innerHTML = '<svg class="icon-svg-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>';
        delBtn.addEventListener("click", (e) => {
          e.preventDefault();
          e.stopPropagation();
          const f = state.folders.find((item) => item.id === folderId);
          if (!f) return;
          const idx = f.bookmarks.findIndex((b) => b.id === bookmark.id);
          if (idx === -1) return;
          mutate(() => { f.bookmarks.splice(idx, 1); });
          showToast(t("bookmarkDeleted"), { actionLabel: t("undo"), onAction: undo });
        });

        wrap.append(editBtn, delBtn);
        return wrap;
      }

      function renderBookmarksStage() {
        const stage = $("bookmarksStage");
        const titleEl = $("workspaceTitle");
        const metaEl = $("workspaceMeta");
        const query = $("globalSearchInput").value;
        const search = runGlobalSearch(query);

        /* 1. SEARCH MODE */
        if (search !== null) {
          renderCarouselFooter(1, 0);
          titleEl.innerHTML = `${renderSvgIcon(85, "icon-svg")} <span>${escapeHtml(t("searchResultsTitle"))}: "${escapeHtml(query.trim())}"</span>`;
          metaEl.textContent = t("bookmarkCount", search.matches.length);

          if (search.matches.length === 0) {
            stage.innerHTML = `<div class="empty-state">${renderSvgIcon(85, "icon-svg-lg")}<div>${escapeHtml(t("emptySearch"))}</div></div>`;
            return;
          }

          const container = document.createElement("div");
          container.className = "search-results-container";

          search.matches.forEach(({ folder, bookmark }, idx) => {
            const a = document.createElement("a");
            a.className = "search-result-row" + (idx === 0 ? " first-hit" : "");
            a.href = safeHref(bookmark.url);
            a.target = "_blank";
            a.rel = "noopener noreferrer";

            const chain = document.createElement("div");
            chain.className = "search-result-chain";

            const folderBadge = document.createElement("span");
            folderBadge.className = "search-result-folder";
            folderBadge.innerHTML = `${renderSvgIcon(folder.iconIndex, "icon-svg-sm")}<span>${escapeHtml(folder.name)}</span>`;

            const mkSep = () => {
              const s = document.createElement("span");
              s.className = "chain-sep";
              s.textContent = "→";
              return s;
            };

            const nameSpan = document.createElement("span");
            nameSpan.className = "search-result-name";
            appendHighlighted(nameSpan, bookmark.title, search.terms);

            const tagsSpan = document.createElement("span");
            tagsSpan.className = "search-result-tags";
            tagsSpan.textContent = formatTagsBrackets(bookmark.tags);

            chain.append(folderBadge, mkSep(), createFavicon(bookmark, "search"), mkSep(), nameSpan, mkSep(), tagsSpan);
            a.appendChild(chain);
            if (idx === 0) {
              const badge = document.createElement("span");
              badge.className = "first-hit-badge";
              badge.textContent = "Enter ↵";
              a.appendChild(badge);
            }
            container.appendChild(a);
          });

          stage.innerHTML = "";
          stage.appendChild(container);
          return;
        }

        /* 2. FOLDER MODE */
        const activeFolder = state.folders.find((f) => f.id === state.activeFolderId) || state.folders[0];
        const bookmarks = activeFolder.bookmarks;

        titleEl.innerHTML = `${renderSvgIcon(activeFolder.iconIndex, "icon-svg")} <span>${escapeHtml(activeFolder.name)}</span>`;
        metaEl.textContent = t("bookmarkCount", bookmarks.length);

        if (bookmarks.length === 0) {
          renderCarouselFooter(1, 0);
          stage.innerHTML = `<div class="empty-state">${renderSvgIcon(52, "icon-svg-lg")}<div>${escapeHtml(t("emptyFolder"))}</div></div>`;
          return;
        }

        const html5Drag = !COARSE.matches;

        /* 2A. LIST VIEW */
        if (state.viewMode === "list") {
          renderCarouselFooter(1, 0);
          const frame = document.createElement("div");
          frame.className = "bookmarks-list-frame";
          const wrap = document.createElement("div");
          wrap.className = "bookmarks-list-container";
          const table = document.createElement("table");
          table.className = "bookmarks-list-table";

          bookmarks.forEach((bm) => {
            const tbody = document.createElement("tbody");
            tbody.className = "bookmarks-list-group";
            tbody.dataset.id = bm.id;
            tbody.draggable = html5Drag;

            tbody.addEventListener("dragstart", (e) => {
              dragCtx = { kind: "bookmark", folderId: activeFolder.id, id: bm.id };
              tbody.classList.add("dragging");
              if (e.dataTransfer) {
                e.dataTransfer.effectAllowed = "move";
                e.dataTransfer.setData("text/plain", bm.id);
              }
            });
            tbody.addEventListener("dragend", () => {
              dragCtx = null;
              tbody.classList.remove("dragging");
              table.querySelectorAll(".bookmarks-list-group").forEach((el) => el.classList.remove("drag-over"));
            });
            tbody.addEventListener("dragover", (e) => {
              if (!dragCtx || dragCtx.kind !== "bookmark" || dragCtx.folderId !== activeFolder.id) return;
              e.preventDefault();
              if (dragCtx.id !== bm.id) tbody.classList.add("drag-over");
            });
            tbody.addEventListener("dragleave", () => tbody.classList.remove("drag-over"));
            tbody.addEventListener("drop", (e) => {
              e.preventDefault();
              tbody.classList.remove("drag-over");
              const ctx = dragCtx;
              dragCtx = null;
              if (ctx && ctx.kind === "bookmark" && ctx.folderId === activeFolder.id) {
                reorderBookmarksInFolder(activeFolder.id, ctx.id, bm.id);
              }
            });

            const trMain = document.createElement("tr");
            trMain.className = "list-row-main";

            const tdIcon = document.createElement("td");
            tdIcon.style.width = "54px";
            tdIcon.appendChild(createFavicon(bm, "list"));

            const tdName = document.createElement("td");
            tdName.style.width = "30%";
            const link = document.createElement("a");
            link.className = "list-link";
            link.href = safeHref(bm.url);
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.draggable = false;
            link.textContent = bm.title;
            tdName.appendChild(link);

            const tdUrl = document.createElement("td");
            tdUrl.className = "list-url-cell";
            tdUrl.textContent = bm.url;

            const tdAct = document.createElement("td");
            tdAct.style.width = COARSE.matches ? "92px" : "84px";
            tdAct.style.textAlign = "right";
            tdAct.appendChild(buildBookmarkActionButtons(activeFolder.id, bm, "list"));

            trMain.append(tdIcon, tdName, tdUrl, tdAct);

            const trTags = document.createElement("tr");
            trTags.className = "list-row-tags";
            const tdTags = document.createElement("td");
            tdTags.colSpan = 4;
            const tagsList = parseTags(bm.tags);
            if (tagsList.length) {
              tagsList.forEach((tg, idx) => {
                const chip = createTagChip(tg, idx, false);
                chip.style.marginRight = "5px";
                tdTags.appendChild(chip);
              });
            } else {
              tdTags.innerHTML = "&nbsp;";
            }
            trTags.appendChild(tdTags);

            tbody.append(trMain, trTags);
            table.appendChild(tbody);
          });

          wrap.appendChild(table);
          frame.appendChild(wrap);
          stage.innerHTML = "";
          stage.appendChild(frame);
          return;
        }

        /* 2B. GRID CAROUSEL */
        const { cols, rows, minCardW } = getEffectiveGridDimensions(bookmarks);
        const perPage = Math.max(1, cols * rows);
        const totalPages = Math.max(1, Math.ceil(bookmarks.length / perPage));
        if (state.carouselPage >= totalPages) state.carouselPage = totalPages - 1;

        const startIdx = state.carouselPage * perPage;
        const pageItems = bookmarks.slice(startIdx, startIdx + perPage);

        const grid = document.createElement("div");
        grid.className = "bookmarks-grid";
        grid.style.setProperty("--grid-cols", String(cols));
        grid.style.setProperty("--card-min-w", `${Math.min(minCardW, CARD_DEFAULT_W)}px`);
        grid.style.setProperty("--card-default-w", `${CARD_DEFAULT_W}px`);
        grid.style.setProperty("--card-max-w", `${CARD_MAX_W}px`);
        grid.style.setProperty("--card-max-h", "110px");

        pageItems.forEach((bm, i) => {
          const card = document.createElement("div");
          card.className = `bookmark-card alt-tone-${(i % 3) + 1}`;
          card.dataset.id = bm.id;
          card.title = `${bm.title} — ${bm.url}`;
          card.draggable = html5Drag;

          card.addEventListener("dragstart", (e) => {
            dragCtx = { kind: "bookmark", folderId: activeFolder.id, id: bm.id };
            card.classList.add("dragging");
            if (e.dataTransfer) {
              e.dataTransfer.effectAllowed = "move";
              e.dataTransfer.setData("text/plain", bm.id);
            }
          });
          card.addEventListener("dragend", () => {
            dragCtx = null;
            card.classList.remove("dragging");
            grid.querySelectorAll(".bookmark-card").forEach((el) => el.classList.remove("drag-over"));
          });
          card.addEventListener("dragover", (e) => {
            if (!dragCtx || dragCtx.kind !== "bookmark" || dragCtx.folderId !== activeFolder.id) return;
            e.preventDefault();
            if (dragCtx.id !== bm.id) card.classList.add("drag-over");
          });
          card.addEventListener("dragleave", () => card.classList.remove("drag-over"));
          card.addEventListener("drop", (e) => {
            e.preventDefault();
            card.classList.remove("drag-over");
            const ctx = dragCtx;
            dragCtx = null;
            if (ctx && ctx.kind === "bookmark" && ctx.folderId === activeFolder.id) {
              reorderBookmarksInFolder(activeFolder.id, ctx.id, bm.id);
            }
          });

          const favPane = document.createElement("div");
          favPane.className = "bookmark-favicon-pane";
          favPane.appendChild(createFavicon(bm, "card"));

          const body = document.createElement("div");
          body.className = "bookmark-body";

          const titleLink = document.createElement("a");
          titleLink.className = "bookmark-title";
          titleLink.href = safeHref(bm.url);
          titleLink.target = "_blank";
          titleLink.rel = "noopener noreferrer";
          titleLink.draggable = false;
          titleLink.textContent = bm.title;

          const tagsCloud = document.createElement("div");
          tagsCloud.className = "bookmark-tags-cloud";
          parseTags(bm.tags).forEach((tg, tIdx) => tagsCloud.appendChild(createTagChip(tg, tIdx, true)));

          body.append(titleLink, tagsCloud);
          card.append(favPane, body, buildBookmarkActionButtons(activeFolder.id, bm, "card"));
          grid.appendChild(card);
        });

        stage.innerHTML = "";
        stage.appendChild(grid);
        grid.querySelectorAll(".bookmark-tags-cloud").forEach(fitTagChips);
        renderCarouselFooter(totalPages, state.carouselPage);
      }

      /* =====================================================================
         GRID PICKER
         ===================================================================== */
      function initGridMatrixPicker() {
        const cellsWrap = $("matrixCells");
        const readout = $("matrixReadout");
        cellsWrap.innerHTML = "";

        const activeFolder = state.folders.find((f) => f.id === state.activeFolderId) || state.folders[0];
        const lim = getGridLimits(activeFolder.bookmarks);

        function highlight(cCount, rCount) {
          readout.textContent = `${cCount} × ${rCount}`;
          cellsWrap.querySelectorAll(".matrix-cell").forEach((cell) => {
            cell.classList.toggle("highlighted", Number(cell.dataset.col) <= cCount && Number(cell.dataset.row) <= rCount);
          });
        }
        const effective = () => {
          const e = getEffectiveGridDimensions(activeFolder.bookmarks);
          return [e.cols, e.rows];
        };

        for (let r = 1; r <= 8; r++) {
          for (let c = 1; c <= 8; c++) {
            const cell = document.createElement("button");
            cell.type = "button";
            cell.className = "matrix-cell";
            cell.dataset.col = String(c);
            cell.dataset.row = String(r);
            cell.setAttribute("aria-label", `${c} × ${r}`);
            // Недоступные на этом экране размеры блокируем: подсветка всегда совпадает с реальной сеткой
            const allowed = c >= lim.minC && c <= lim.maxC && r >= lim.minR && r <= lim.maxR;
            cell.disabled = !allowed;
            if (allowed) {
              cell.addEventListener("mouseenter", () => highlight(c, r));
              cell.addEventListener("focus", () => highlight(c, r));
              cell.addEventListener("click", () => {
                state.gridCols = c;
                state.gridRows = r;
                state.viewMode = "grid";
                state.carouselPage = 0;
                savePrefs();
                closePopovers();
                syncConfigButtons();
                renderBookmarksStage();
              });
            }
            cellsWrap.appendChild(cell);
          }
        }

        cellsWrap.onmouseleave = () => highlight(...effective());
        highlight(...effective());
      }

      function positionFolderPopover(anchorEl, isNewFolder) {
        const pop = $("folderCreatorPopover");
        const isMobile = window.innerWidth <= 720;
        if (isNewFolder) {
          pop.style.top = "auto";
          pop.style.left = isMobile ? "calc(var(--sidebar-compact-w) + 8px)" : "78px";
          pop.style.bottom = isMobile ? "70px" : "16px";
          return;
        }
        if (!anchorEl) return;
        const rect = anchorEl.getBoundingClientRect();
        const popW = Math.min(332, window.innerWidth - 24);
        const popH = 330;
        let left = rect.right + 10;
        if (left + popW > window.innerWidth - 12) left = Math.max(12, window.innerWidth - popW - 12);
        let top = rect.top - 12;
        if (top + popH > window.innerHeight - 12) top = Math.max(12, window.innerHeight - popH - 12);
        pop.style.bottom = "auto";
        pop.style.left = `${Math.round(left)}px`;
        pop.style.top = `${Math.round(top)}px`;
      }

      function openFolderPopover(existingFolder = null, anchorEl = null) {
        closePopovers();
        if (existingFolder) {
          editingFolderId = existingFolder.id;
          selectedFolderIcon = existingFolder.iconIndex;
          $("folderPopTitle").textContent = t("editFolderTitle");
          $("newFolderNameInput").value = existingFolder.name;
          $("confirmFolderBtn").textContent = t("save");
        } else {
          editingFolderId = null;
          selectedFolderIcon = 1;
          $("folderPopTitle").textContent = t("createFolderTitle");
          $("newFolderNameInput").value = "";
          $("confirmFolderBtn").textContent = t("create");
        }
        initFolderIconPicker();
        positionFolderPopover(anchorEl, !existingFolder);
        $("folderCreatorPopover").classList.add("open");
        setTimeout(() => $("newFolderNameInput").focus(), 40);
      }

      function confirmFolderPopover() {
        const input = $("newFolderNameInput");
        const name = clip(input.value, 40);
        if (!name) {
          showToast(t("needFolderName"));
          input.focus();
          return;
        }

        if (editingFolderId) {
          const target = state.folders.find((f) => f.id === editingFolderId);
          if (target) {
            closePopovers();
            mutate(() => { target.name = name; target.iconIndex = selectedFolderIcon; });
            showToast(t("folderUpdated"));
          }
          return;
        }

        const newFolder = { id: uid("f"), name, iconIndex: selectedFolderIcon, bookmarks: [] };
        closePopovers();
        mutate(() => {
          state.folders.push(newFolder);
          state.activeFolderId = newFolder.id;
          state.carouselPage = 0;
        });
        savePrefs();
        showToast(t("folderCreated"));

         BOOKMARK MODAL
         ===================================================================== */
      function openBookmarkModal(folderId = null, bookmark = null) {
        closePopovers();
        editingBookmarkCtx = bookmark ? { folderId, bookmarkId: bookmark.id } : null;

        const select = $("bmFolderSelect");
        select.innerHTML = "";
        state.folders.forEach((f) => {
          const opt = document.createElement("option");
          opt.value = f.id;
          opt.textContent = f.name;
          select.appendChild(opt);
        });
        select.value = folderId || state.activeFolderId || state.folders[0].id;

        $("bookmarkModalTitle").textContent = bookmark ? t("editBookmarkTitle") : t("addBookmarkTitle");
        $("bmTitleInput").value = bookmark ? bookmark.title : "";
        $("bmUrlInput").value = bookmark ? bookmark.url : "";
        $("bmIconInput").value = bookmark && bookmark.iconUrl && bookmark.iconUrl !== "<favicon>" ? bookmark.iconUrl : "";
        $("bmTagsInput").value = bookmark ? parseTags(bookmark.tags).join(" ") : "";

        openModal("bookmarkModalBackdrop", "bmTitleInput");
      }

      function closeBookmarkModal() {
        hideModal("bookmarkModalBackdrop");
        editingBookmarkCtx = null;
      }

      function saveBookmarkFromModal() {
        const targetFolderId = $("bmFolderSelect").value;
        const title = clip($("bmTitleInput").value, 120);
        const rawUrl = $("bmUrlInput").value.trim();
        if (!title || !rawUrl) {
          showToast(t("needTitleUrl"));
          return;
        }
        const url = sanitizeUrl(rawUrl);
        if (!url) {
          showToast(t("invalidUrl"));
          $("bmUrlInput").focus();
          return;
        }
        const iconUrl = sanitizeIconUrl($("bmIconInput").value);
        const tags = parseTags($("bmTagsInput").value);

        const targetFolder = state.folders.find((f) => f.id === targetFolderId);
        if (!targetFolder) return;

        const ctx = editingBookmarkCtx;
        closeBookmarkModal();

        mutate(() => {
          if (ctx) {
            const oldFolder = state.folders.find((f) => f.id === ctx.folderId);
            const idx = oldFolder ? oldFolder.bookmarks.findIndex((b) => b.id === ctx.bookmarkId) : -1;
            if (idx !== -1) {
              const updated = Object.assign({}, oldFolder.bookmarks[idx], { title, url, iconUrl, tags });
              if (oldFolder.id === targetFolder.id) {
                oldFolder.bookmarks[idx] = updated;
              } else {
                oldFolder.bookmarks.splice(idx, 1);
                targetFolder.bookmarks.push(updated);
              }
            }
          } else {
            targetFolder.bookmarks.push({ id: uid("b"), title, url, iconUrl, tags });
          }
          state.activeFolderId = targetFolder.id;
        });
        savePrefs();
        showToast(t("bookmarkSaved"));
      }
