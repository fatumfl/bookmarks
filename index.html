<!DOCTYPE html>
<html lang="ru" data-theme="dark" data-font="sans">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <!-- Жёсткая политика: никаких сетевых запросов из скриптов (connect-src закрыт через default-src 'none'),
       картинки (favicon) разрешены, всё остальное запрещено. Закрепляет ADR006 технически. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src https: http: data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'; base-uri 'none'; form-action 'none'; frame-src 'none'; object-src 'none'" />
  <title>Bookmarks — Personal New Tab Dashboard</title>
  <style>
    /* =========================================================================
       MATERIAL DESIGN 3 / ANDROID-INSPIRED DESIGN TOKENS & SYSTEM FONTS
       ========================================================================= */
    :root,
    [data-theme="dark"] {
      --md-sys-color-primary: #a8c7fa;
      --md-sys-color-on-primary: #062e6f;
      --md-sys-color-primary-container: #1b3b6f;
      --md-sys-color-on-primary-container: #d8e6ff;
      --md-sys-color-secondary: #c4cad4;
      --md-sys-color-on-secondary: #252b33;
      --md-sys-color-secondary-container: #2b384e;
      --md-sys-color-on-secondary-container: #dce8ff;
      --md-sys-color-tertiary: #8bd4a3;
      --md-sys-color-on-tertiary: #09381c;
      --md-sys-color-error: #f28b82;
      --md-sys-color-on-error: #601410;
      --md-sys-color-error-container: #8c1d18;
      --md-sys-color-on-error-container: #f9dedc;
      --md-sys-color-surface: #111827;
      --md-sys-color-surface-dim: #0b111e;
      --md-sys-color-surface-container-lowest: #0a0f1a;
      --md-sys-color-surface-container-low: #162032;
      --md-sys-color-surface-container: #1b283e;
      --md-sys-color-surface-container-high: #22324d;
      --md-sys-color-surface-container-highest: #2b3e5e;
      --md-sys-color-on-surface: #eef2f8;
      --md-sys-color-on-surface-variant: #b8c2d1;
      --md-sys-color-outline: #7c889c;
      --md-sys-color-outline-variant: #31425e;
      --md-sys-color-scrim: rgba(4, 8, 15, 0.72);
      --card-alt-bg: #12223a;
      --card-alt-bg-2: #192b47;
      --card-alt-bg-3: #152640;
      --tag-bg-1: rgba(168, 199, 250, 0.22);
      --tag-fg-1: #cfe1ff;
      --tag-bg-2: rgba(139, 212, 163, 0.22);
      --tag-fg-2: #bcefd0;
      --tag-bg-3: rgba(246, 193, 119, 0.22);
      --tag-fg-3: #fae0b5;
      --tag-bg-4: rgba(210, 168, 255, 0.22);
      --tag-fg-4: #ebd8ff;
      --md-shadow-1: 0 2px 6px rgba(0, 0, 0, 0.35), 0 1px 3px rgba(0, 0, 0, 0.25);
      --md-shadow-2: 0 6px 14px rgba(0, 0, 0, 0.45), 0 2px 5px rgba(0, 0, 0, 0.3);
      --md-shadow-3: 0 12px 28px rgba(0, 0, 0, 0.6), 0 4px 10px rgba(0, 0, 0, 0.38);
      --bg-gradient:
        linear-gradient(125deg, rgba(29, 78, 137, 0.42) 0%, rgba(17, 24, 39, 0.92) 48%, rgba(30, 58, 95, 0.48) 100%),
        radial-gradient(circle at 18% 20%, rgba(56, 139, 253, 0.22), transparent 46%),
        radial-gradient(circle at 82% 78%, rgba(46, 160, 120, 0.16), transparent 48%),
        linear-gradient(180deg, #0f172a 0%, #111827 100%);
    }

    [data-theme="light"] {
      --md-sys-color-primary: #1558c0;
      --md-sys-color-on-primary: #ffffff;
      --md-sys-color-primary-container: #cfe2ff;
      --md-sys-color-on-primary-container: #072254;
      --md-sys-color-secondary: #475569;
      --md-sys-color-on-secondary: #ffffff;
      --md-sys-color-secondary-container: #dce7f7;
      --md-sys-color-on-secondary-container: #132238;
      --md-sys-color-tertiary: #116634;
      --md-sys-color-on-tertiary: #ffffff;
      --md-sys-color-error: #b3261e;
      --md-sys-color-on-error: #ffffff;
      --md-sys-color-error-container: #f9dedc;
      --md-sys-color-on-error-container: #410e0b;
      --md-sys-color-surface: #eaf0f7;
      --md-sys-color-surface-dim: #dfe7f1;
      --md-sys-color-surface-container-lowest: #ffffff;
      --md-sys-color-surface-container-low: #f4f7fb;
      --md-sys-color-surface-container: #e8eff8;
      --md-sys-color-surface-container-high: #dde6f3;
      --md-sys-color-surface-container-highest: #cedbef;
      --md-sys-color-on-surface: #131c2e;
      --md-sys-color-on-surface-variant: #3b4963;
      --md-sys-color-outline: #64748b;
      --md-sys-color-outline-variant: #b8c7dc;
      --md-sys-color-scrim: rgba(15, 23, 42, 0.45);
      --card-alt-bg: #eef4fc;
      --card-alt-bg-2: #e4eefb;
      --card-alt-bg-3: #f7faff;
      --tag-bg-1: rgba(21, 88, 192, 0.14);
      --tag-fg-1: #11479c;
      --tag-bg-2: rgba(17, 102, 52, 0.15);
      --tag-fg-2: #0e542a;
      --tag-bg-3: rgba(161, 86, 12, 0.15);
      --tag-fg-3: #8a4808;
      --tag-bg-4: rgba(107, 45, 173, 0.14);
      --tag-fg-4: #582094;
      --md-shadow-1: 0 2px 6px rgba(15, 23, 42, 0.10), 0 1px 3px rgba(15, 23, 42, 0.06);
      --md-shadow-2: 0 6px 14px rgba(15, 23, 42, 0.14), 0 2px 5px rgba(15, 23, 42, 0.08);
      --md-shadow-3: 0 12px 28px rgba(15, 23, 42, 0.20), 0 4px 10px rgba(15, 23, 42, 0.12);
      --bg-gradient:
        linear-gradient(128deg, rgba(147, 184, 230, 0.55) 0%, rgba(235, 242, 250, 0.92) 52%, rgba(176, 206, 240, 0.58) 100%),
        radial-gradient(circle at 15% 18%, rgba(59, 130, 246, 0.18), transparent 46%),
        radial-gradient(circle at 85% 82%, rgba(16, 185, 129, 0.14), transparent 48%),
        linear-gradient(180deg, #e2ebf5 0%, #edf2f8 100%);
    }

    :root {
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif, "Apple Color Emoji", "Segoe UI Emoji";
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      --font-current: var(--font-sans);
      --base-font-size: 16px;
      --sidebar-compact-w: 68px;
      --sidebar-expanded-w: 256px;
      --card-default-w: 280px;
      --card-max-w: 280px;
      --card-max-h: 110px;
      --radius-xl: 20px;
      --radius-lg: 14px;
      --radius-md: 10px;
      --radius-sm: 8px;
      --radius-pill: 999px;
      --ease-std: cubic-bezier(0.2, 0, 0, 1);
      --ease-emph: cubic-bezier(0.3, 0, 0, 1);
    }

    [data-font="mono"] {
      --font-current: var(--font-mono);
      --base-font-size: 18.5px;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden;
      background-color: var(--md-sys-color-surface);
      background-image: var(--bg-gradient);
      background-attachment: fixed;
      color: var(--md-sys-color-on-surface);
      font-family: var(--font-current);
      font-size: var(--base-font-size);
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    input, textarea, select {
      -webkit-user-select: text;
      user-select: text;
    }

    button, input, select, textarea {
      font-family: inherit;
      color: inherit;
    }

    button {
      background: none;
      border: none;
      cursor: pointer;
    }

    :focus-visible {
      outline: 2px solid var(--md-sys-color-primary);
      outline-offset: 2px;
    }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb {
      background: var(--md-sys-color-outline-variant);
      border-radius: var(--radius-pill);
    }
    ::-webkit-scrollbar-thumb:hover { background: var(--md-sys-color-outline); }

    .icon-svg { width: 22px; height: 22px; flex-shrink: 0; display: inline-block; vertical-align: middle; }
    .icon-svg-sm { width: 17px; height: 17px; flex-shrink: 0; }
    .icon-svg-lg { width: 28px; height: 28px; flex-shrink: 0; }

    /* =========================================================================
       APP SHELL & LEFT FOLDER RAIL
       ========================================================================= */
    .app-shell {
      display: flex;
      height: 100dvh;
      width: 100vw;
      overflow: hidden;
      position: relative;
    }

    .folder-sidebar {
      width: var(--sidebar-compact-w);
      min-width: var(--sidebar-compact-w);
      height: 100%;
      background-color: var(--md-sys-color-surface-container-low);
      border-right: 1px solid var(--md-sys-color-outline-variant);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 12px 8px;
      transition: width 220ms var(--ease-emph), min-width 220ms var(--ease-emph), background-color 180ms var(--ease-std);
      z-index: 25;
      position: relative;
    }

    .folder-sidebar.expanded {
      width: var(--sidebar-expanded-w);
      min-width: var(--sidebar-expanded-w);
      box-shadow: var(--md-shadow-2);
    }

    .sidebar-top { display: flex; flex-direction: column; gap: 6px; flex: 1; min-height: 0; }

    .sidebar-header-row {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 46px;
      margin-bottom: 4px;
    }

    .folder-sidebar.expanded .sidebar-header-row { justify-content: space-between; padding: 0 6px; }

    .brand-badge {
      display: none;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 0.94em;
      letter-spacing: 0.04em;
      color: var(--md-sys-color-primary);
      white-space: nowrap;
      overflow: hidden;
    }

    .folder-sidebar.expanded .brand-badge { display: flex; }

    .toggle-rail-btn {
      width: 40px;
      height: 40px;
      border-radius: var(--radius-pill);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--md-sys-color-on-surface-variant);
      transition: background-color 150ms var(--ease-std), color 150ms var(--ease-std), transform 200ms var(--ease-emph);
    }

    .toggle-rail-btn:hover { background-color: var(--md-sys-color-surface-container-high); color: var(--md-sys-color-on-surface); }
    .folder-sidebar.expanded .toggle-rail-btn svg { transform: rotate(180deg); }

    .folder-list {
      display: flex;
      flex-direction: column;
      gap: 5px;
      overflow-y: auto;
      overflow-x: hidden;
      padding-right: 2px;
      flex: 1;
    }

    /* Строка папки: визуальный контейнер. Внутри — основная кнопка и отдельные кнопки действий
       (никаких вложенных интерактивных элементов, доступно с клавиатуры). */
    .folder-row {
      position: relative;
      display: flex;
      align-items: center;
      height: 46px;
      min-height: 46px;
      width: 100%;
      border-radius: var(--radius-md);
      color: var(--md-sys-color-on-surface-variant);
      transition: background-color 150ms var(--ease-std), color 150ms var(--ease-std);
    }

    .folder-row[draggable="true"] { cursor: grab; }
    .folder-row[draggable="true"]:active { cursor: grabbing; }
    .folder-row.drag-over {
      outline: 2px dashed var(--md-sys-color-primary);
      background-color: var(--md-sys-color-primary-container);
    }
    .folder-row.dragging { opacity: 0.45; }
    .folder-row:hover { background-color: var(--md-sys-color-surface-container-high); color: var(--md-sys-color-on-surface); }
    .folder-row.active {
      background-color: var(--md-sys-color-primary-container);
      color: var(--md-sys-color-on-primary-container);
      font-weight: 600;
    }

    .folder-item {
      flex: 1;
      min-width: 0;
      height: 100%;
      display: flex;
      align-items: center;
      padding: 0 12px;
      border-radius: inherit;
      color: inherit;
      font-weight: inherit;
      text-align: left;
      -webkit-touch-callout: none;
    }

    .folder-sidebar:not(.expanded) .folder-item { justify-content: center; padding: 0; }

    .folder-item-label {
      display: none;
      margin-left: 10px;
      font-size: 0.9em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }
    .folder-sidebar.expanded .folder-item-label { display: block; }

    .folder-item-count {
      display: none;
      font-size: 0.75em;
      opacity: 0.8;
      margin-left: 4px;
      padding: 1px 7px;
      border-radius: var(--radius-pill);
      background: rgba(128, 128, 128, 0.18);
    }
    .folder-sidebar.expanded .folder-item-count { display: inline-block; }

    .folder-item-actions {
      display: none;
      align-items: center;
      gap: 2px;
      padding-right: 6px;
      flex-shrink: 0;
    }

    .folder-sidebar.expanded .folder-row:hover .folder-item-actions,
    .folder-sidebar.expanded .folder-row:focus-within .folder-item-actions { display: inline-flex; }

    .folder-action-mini {
      width: 28px;
      height: 28px;
      border-radius: var(--radius-sm);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: inherit;
      opacity: 0.8;
    }
    .folder-action-mini:hover { opacity: 1; background-color: var(--md-sys-color-surface-container-highest); color: var(--md-sys-color-on-surface); }
    .folder-action-mini.del:hover { background-color: var(--md-sys-color-error-container); color: var(--md-sys-color-on-error-container); }

    .sidebar-bottom {
      padding-top: 8px;
      border-top: 1px solid var(--md-sys-color-outline-variant);
      display: flex;
      flex-direction: column;
      gap: 6px;
      position: relative;
    }

    .lock-sort-btn {
      display: flex;
      align-items: center;
      height: 40px;
      width: 100%;
      padding: 0 12px;
      border-radius: var(--radius-md);
      background-color: var(--md-sys-color-surface-container);
      color: var(--md-sys-color-on-surface-variant);
      font-weight: 600;
      font-size: 0.84em;
      transition: background-color 150ms var(--ease-std), color 150ms var(--ease-std);
    }
    .folder-sidebar:not(.expanded) .lock-sort-btn { justify-content: center; padding: 0; }
    .lock-sort-btn:hover { background-color: var(--md-sys-color-surface-container-high); color: var(--md-sys-color-on-surface); }
    .lock-sort-btn.locked { background-color: var(--md-sys-color-secondary-container); color: var(--md-sys-color-on-secondary-container); }
    .lock-sort-label { display: none; margin-left: 10px; white-space: nowrap; }
    .folder-sidebar.expanded .lock-sort-label { display: inline; }

    .add-folder-btn {
      display: flex;
      align-items: center;
      height: 44px;
      width: 100%;
      padding: 0 12px;
      border-radius: var(--radius-md);
      background-color: var(--md-sys-color-surface-container-high);
      color: var(--md-sys-color-primary);
      font-weight: 600;
      font-size: 0.88em;
      transition: background-color 150ms var(--ease-std), transform 140ms var(--ease-std);
    }
    .folder-sidebar:not(.expanded) .add-folder-btn { justify-content: center; padding: 0; }
    .add-folder-btn:hover { background-color: var(--md-sys-color-primary-container); color: var(--md-sys-color-on-primary-container); }
    .add-folder-btn:active { transform: scale(0.97); }
    .add-folder-label { display: none; margin-left: 10px; white-space: nowrap; }
    .folder-sidebar.expanded .add-folder-label { display: inline; }

    /* =========================================================================
       MAIN WORKSPACE
       ========================================================================= */
    .main-content {
      flex: 1;
      min-width: 0;
      height: 100%;
      display: flex;
      flex-direction: column;
      padding: 18px 86px 16px 26px;
      position: relative;
      overflow: hidden;
    }

    .search-wrapper {
      width: 100%;
      max-width: 820px;
      margin: 0 auto 12px auto;
      position: relative;
      z-index: 20;
    }

    .search-box {
      display: flex;
      align-items: center;
      gap: 12px;
      height: 52px;
      padding: 0 18px;
      border-radius: var(--radius-pill);
      background-color: var(--md-sys-color-surface-container-lowest);
      border: 2px solid var(--md-sys-color-outline);
      box-shadow: var(--md-shadow-2);
      transition: border-color 160ms var(--ease-std), box-shadow 160ms var(--ease-std);
    }

    [data-theme="light"] .search-box {
      background-color: #ffffff;
      border-color: #2563eb;
      box-shadow: 0 4px 16px rgba(21, 88, 192, 0.16), 0 1px 4px rgba(15, 23, 42, 0.12);
    }

    .search-box:focus-within {
      border-color: var(--md-sys-color-primary);
      box-shadow: 0 0 0 3px rgba(21, 88, 192, 0.22), var(--md-shadow-3);
    }

    .search-input {
      flex: 1;
      min-width: 0;
      background: transparent;
      border: none;
      outline: none;
      font-size: 0.97em;
      font-weight: 500;
      color: var(--md-sys-color-on-surface);
    }
    .search-input:focus-visible { outline: none; }
    .search-input::placeholder { color: var(--md-sys-color-on-surface-variant); opacity: 0.85; font-size: 0.9em; }

    .search-clear-btn {
      display: none;
      width: 30px;
      height: 30px;
      border-radius: var(--radius-pill);
      align-items: center;
      justify-content: center;
      color: var(--md-sys-color-on-surface-variant);
    }
    .search-clear-btn.visible { display: inline-flex; }
    .search-clear-btn:hover { background-color: var(--md-sys-color-surface-container-high); color: var(--md-sys-color-on-surface); }

    .at-commands-dropdown {
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      right: 0;
      background-color: var(--md-sys-color-surface-container-high);
      border: 1px solid var(--md-sys-color-outline);
      border-radius: var(--radius-lg);
      box-shadow: var(--md-shadow-3);
      padding: 6px;
      display: none;
      flex-direction: column;
      gap: 2px;
      z-index: 45;
      max-height: 300px;
      overflow-y: auto;
    }
    .at-commands-dropdown.open { display: flex; }

    .at-command-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      width: 100%;
      padding: 9px 12px;
      border-radius: var(--radius-md);
      text-align: left;
      transition: background-color 130ms var(--ease-std);
    }
    .at-command-item:hover,
    .at-command-item.selected { background-color: var(--md-sys-color-primary-container); color: var(--md-sys-color-on-primary-container); }

    .at-cmd-name {
      font-family: var(--font-mono);
      font-weight: 700;
      font-size: 0.88em;
      color: var(--md-sys-color-primary);
      white-space: nowrap;
    }
    .at-command-item:hover .at-cmd-name,
    .at-command-item.selected .at-cmd-name { color: inherit; }

    .at-cmd-desc { font-size: 0.84em; color: var(--md-sys-color-on-surface-variant); text-align: right; }
    .at-command-item:hover .at-cmd-desc,
    .at-command-item.selected .at-cmd-desc { color: inherit; opacity: 0.92; }

    .search-hints {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-top: 7px;
      padding: 0 10px;
      font-size: 0.81em;
      color: var(--md-sys-color-on-surface-variant);
    }

    .search-hint-chip {
      padding: 2px 10px;
      border-radius: var(--radius-pill);
      background-color: var(--md-sys-color-surface-container-low);
      border: 1px solid var(--md-sys-color-outline-variant);
      color: inherit;
      cursor: pointer;
      font-family: var(--font-mono);
      font-size: 0.95em;
      transition: background-color 140ms var(--ease-std), color 140ms var(--ease-std);
    }
    .search-hint-chip:hover { background-color: var(--md-sys-color-primary-container); color: var(--md-sys-color-on-primary-container); }

    .workspace-header {
      width: 100%;
      max-width: 1440px;
      margin: 0 auto 10px auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 34px;
    }

    .current-folder-title {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1.18em;
      font-weight: 700;
      letter-spacing: -0.01em;
      min-width: 0;
    }
    .current-folder-title > span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .meta-pill {
      font-size: 0.81em;
      font-weight: 600;
      padding: 4px 12px;
      border-radius: var(--radius-pill);
      background-color: var(--md-sys-color-surface-container-high);
      color: var(--md-sys-color-on-surface-variant);
      border: 1px solid var(--md-sys-color-outline-variant);
      white-space: nowrap;
    }

    /* =========================================================================
       BOOKMARKS STAGE
       ========================================================================= */
    .bookmarks-stage {
      flex: 1;
      min-height: 0;
      width: 100%;
      max-width: 1440px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      position: relative;
      touch-action: pan-y;
    }

    /* Карточка имеет ширину --card-default-w (280px) и сжимается только если
       не влезает в ширину столбца / окна (minmax(0, min(var(--card-min-w, 280px), var(--card-default-w, 280px)))). */
    .bookmarks-grid {
      display: grid;
      grid-template-columns: repeat(var(--grid-cols, 3), minmax(0, min(var(--card-min-w, 280px), var(--card-default-w, 280px))));
      grid-auto-rows: minmax(84px, var(--card-max-h, 110px));
      gap: 14px;
      flex: 1;
      min-height: 0;
      align-content: start;
      justify-content: center;
      overflow: hidden;
      padding-top: 14px; /* место под всплывающие кнопки первой строки */
    }

    .bookmark-card {
      position: relative;
      display: flex;
      align-items: center;
      gap: 14px;
      width: 100%;
      max-width: var(--card-default-w, 280px);
      height: 100%;
      max-height: var(--card-max-h, 110px);
      padding: 12px 14px;
      border-radius: var(--radius-md);
      background-color: var(--card-alt-bg);
      border: 1px solid var(--md-sys-color-outline-variant);
      color: var(--md-sys-color-on-surface);
      box-shadow: var(--md-shadow-1);
      transition: transform 170ms var(--ease-emph), border-color 170ms var(--ease-std), box-shadow 170ms var(--ease-std), opacity 140ms var(--ease-std);
      min-width: 0;
      min-height: 0;
      overflow: visible;
      cursor: grab;
      -webkit-touch-callout: none;
    }
    .bookmark-card:active { cursor: grabbing; }
    .bookmark-card.dragging { opacity: 0.4; }
    .bookmark-card.drag-over { outline: 2px dashed var(--md-sys-color-primary); border-color: var(--md-sys-color-primary); }
    .bookmark-card.alt-tone-1 { background-color: var(--card-alt-bg); }
    .bookmark-card.alt-tone-2 { background-color: var(--card-alt-bg-2); }
    .bookmark-card.alt-tone-3 { background-color: var(--card-alt-bg-3); }
    .bookmark-card:hover,
    .bookmark-card:focus-within {
      border-color: var(--md-sys-color-primary);
      transform: translateY(-2px);
      box-shadow: var(--md-shadow-2);
      z-index: 5;
    }

    .bookmark-favicon-pane {
      width: clamp(32px, 34%, 56px);
      height: clamp(32px, 56%, 64px);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Иконки сайтов и запасной «аватар» с буквой */
    .fav { display: inline-flex; align-items: center; justify-content: center; overflow: hidden; flex-shrink: 0; }
    .fav img { width: 100%; height: 100%; object-fit: contain; }
    .fav-card { width: 100%; height: 100%; }
    .fav-list { width: 24px; height: 24px; }
    .fav-search { width: 20px; height: 20px; }
    .fav-fallback {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      max-width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 22%;
      color: #fff;
      font-weight: 700;
      font-size: 0.95em;
      line-height: 1;
    }
    .fav-search .fav-fallback, .fav-list .fav-fallback { font-size: 0.72em; }

    .bookmark-body {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
      gap: 6px;
      overflow: hidden;
    }

    /* Ссылка-заголовок растягивается на всю карточку (stretched link): нет вложенных интерактивных элементов */
    .bookmark-title {
      display: block;
      color: inherit;
      text-decoration: none;
      font-size: 0.94em;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      width: 100%;
      text-align: left;
      line-height: 1.25;
      -webkit-user-drag: none;
    }
    .bookmark-title::after { content: ""; position: absolute; inset: 0; border-radius: inherit; }
    .bookmark-title:focus-visible { outline: none; }
    .bookmark-card:has(.bookmark-title:focus-visible) { outline: 2px solid var(--md-sys-color-primary); outline-offset: 2px; }

    .bookmark-tags-cloud {
      display: flex;
      flex-wrap: wrap;
      align-content: flex-start;
      align-items: center;
      justify-content: flex-start;
      gap: 4px;
      max-height: 44px;
      overflow: hidden;
      width: 100%;
    }

    .tag-chip {
      position: relative;
      z-index: 2;
      display: inline-flex;
      align-items: center;
      padding: 1px 7px;
      border-radius: 6px;
      font-size: 0.75em;
      font-weight: 600;
      line-height: 1.35;
      white-space: nowrap;
      cursor: pointer;
      border: 1px solid transparent;
      transition: transform 120ms var(--ease-std), filter 120ms var(--ease-std);
    }
    .tag-chip:hover { transform: scale(1.04); filter: brightness(1.08); }
    .tag-chip.c0 { background: var(--tag-bg-1); color: var(--tag-fg-1); }
    .tag-chip.c1 { background: var(--tag-bg-2); color: var(--tag-fg-2); }
    .tag-chip.c2 { background: var(--tag-bg-3); color: var(--tag-fg-3); }
    .tag-chip.c3 { background: var(--tag-bg-4); color: var(--tag-fg-4); }
    .tag-chip.tag-more {
      cursor: default;
      background: transparent;
      border: 1px dashed var(--md-sys-color-outline);
      color: var(--md-sys-color-on-surface-variant);
    }
    .tag-chip.tag-more:hover { transform: none; filter: none; }

    .bookmark-actions {
      position: absolute;
      top: -12px;
      right: 6px;
      display: flex;
      gap: 4px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 150ms var(--ease-std), transform 150ms var(--ease-std);
      transform: translateY(2px);
      background: var(--md-sys-color-surface-container-highest);
      border: 1px solid var(--md-sys-color-outline);
      border-radius: var(--radius-pill);
      padding: 2px 4px;
      box-shadow: var(--md-shadow-2);
      z-index: 12;
    }
    .bookmark-card:hover .bookmark-actions,
    .bookmark-card:focus-within .bookmark-actions { opacity: 1; pointer-events: auto; transform: translateY(0); }

    .mini-icon-btn {
      width: 24px;
      height: 24px;
      border-radius: var(--radius-pill);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--md-sys-color-on-surface);
    }
    .mini-icon-btn:hover { background-color: var(--md-sys-color-primary-container); color: var(--md-sys-color-on-primary-container); }
    .mini-icon-btn.del:hover { background-color: var(--md-sys-color-error); color: var(--md-sys-color-on-error); }

    /* Тач-устройства: действия всегда видны, цели крупнее */
    @media (hover: none) {
      .bookmark-actions { opacity: 1; pointer-events: auto; transform: none; }
      .list-actions { opacity: 1; }
      .folder-sidebar.expanded .folder-item-actions { display: inline-flex; }
    }
    @media (pointer: coarse) {
      .mini-icon-btn { width: 34px; height: 34px; }
      .bookmark-actions { top: -16px; padding: 3px 5px; }
      .folder-action-mini { width: 34px; height: 34px; }
      .tag-chip { padding: 3px 9px; }
    }

    /* List view */
    .bookmarks-list-frame {
      flex: 1;
      min-height: 0;
      border-radius: var(--radius-lg);
      border: 1px solid var(--md-sys-color-outline-variant);
      background-color: var(--md-sys-color-surface-container-low);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .bookmarks-list-container { flex: 1; min-height: 0; overflow-y: auto; padding: 4px 6px 4px 0; }
    .bookmarks-list-table { width: 100%; border-collapse: collapse; table-layout: fixed; }

    .bookmarks-list-group:nth-of-type(odd) .list-row-main,
    .bookmarks-list-group:nth-of-type(odd) .list-row-tags { background-color: var(--card-alt-bg); }
    .bookmarks-list-group:nth-of-type(even) .list-row-main,
    .bookmarks-list-group:nth-of-type(even) .list-row-tags { background-color: var(--card-alt-bg-2); }
    .bookmarks-list-group:hover .list-row-main,
    .bookmarks-list-group:hover .list-row-tags { background-color: var(--md-sys-color-surface-container-highest); }
    .bookmarks-list-group.dragging { opacity: 0.45; }
    .bookmarks-list-group.drag-over .list-row-main { outline: 2px dashed var(--md-sys-color-primary); }

    .list-row-main td {
      padding: 10px 14px 4px 14px;
      vertical-align: middle;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 0.94em;
    }
    .list-row-tags td {
      padding: 2px 14px 10px 14px;
      border-bottom: 1px solid var(--md-sys-color-outline-variant);
      font-size: 0.78em;
    }

    .list-link {
      color: inherit;
      text-decoration: none;
      font-weight: 700;
      display: inline-block;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      vertical-align: middle;
    }
    .list-link:hover { color: var(--md-sys-color-primary); text-decoration: underline; }

    .list-url-cell {
      font-size: 0.84em;
      color: var(--md-sys-color-on-surface-variant);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* Кнопки действий в режиме списка (раньше были скрыты навсегда) */
    .list-actions {
      display: inline-flex;
      gap: 4px;
      opacity: 0;
      transition: opacity 150ms var(--ease-std);
    }
    .bookmarks-list-group:hover .list-actions,
    .bookmarks-list-group:focus-within .list-actions { opacity: 1; }

    /* Search results */
    .search-results-container {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding-right: 4px;
    }

    .search-result-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 11px 16px;
      border-radius: var(--radius-md);
      background-color: var(--md-sys-color-surface-container-low);
      border: 1px solid var(--md-sys-color-outline-variant);
      text-decoration: none;
      color: var(--md-sys-color-on-surface);
      font-size: 0.94em;
      transition: background-color 150ms var(--ease-std), border-color 150ms var(--ease-std);
    }
    .search-result-row:hover { background-color: var(--md-sys-color-surface-container-high); border-color: var(--md-sys-color-primary); }
    .search-result-row.first-hit { border-color: var(--md-sys-color-primary); }
    .first-hit-badge {
      font-family: var(--font-mono);
      font-size: 0.78em;
      padding: 1px 8px;
      border-radius: 6px;
      border: 1px solid var(--md-sys-color-outline);
      color: var(--md-sys-color-on-surface-variant);
      white-space: nowrap;
    }

    .search-result-chain { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; flex-wrap: wrap; }
    .chain-sep { color: var(--md-sys-color-outline); font-weight: 700; }

    .search-result-folder {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.84em;
      font-weight: 600;
      padding: 3px 10px;
      border-radius: var(--radius-pill);
      background-color: var(--md-sys-color-secondary-container);
      color: var(--md-sys-color-on-secondary-container);
    }

    .search-result-name { font-weight: 700; font-size: 0.94em; }
    .search-result-name mark {
      background: var(--tag-bg-3);
      color: inherit;
      border-radius: 3px;
      padding: 0 2px;
    }
    .search-result-tags { font-family: var(--font-mono); font-size: 0.81em; color: var(--md-sys-color-tertiary); white-space: nowrap; }

    /* Carousel dots */
    .carousel-footer { display: flex; flex-direction: column; align-items: center; justify-content: center; padding-top: 8px; min-height: 20px; }
    .carousel-indicator { display: flex; align-items: center; justify-content: center; gap: 8px; }

    .carousel-dot {
      position: relative;
      width: 10px;
      height: 10px;
      border-radius: var(--radius-pill);
      background-color: var(--md-sys-color-outline-variant);
      transition: width 200ms var(--ease-emph), background-color 200ms var(--ease-std);
      padding: 0;
    }
    .carousel-dot::after { content: ""; position: absolute; inset: -14px -4px; } /* увеличенная область нажатия */
    .carousel-dot:hover { background-color: var(--md-sys-color-outline); }
    .carousel-dot.active { width: 26px; background-color: var(--md-sys-color-primary); }

    .empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      font-size: 1em;
      color: var(--md-sys-color-on-surface-variant);
      text-align: center;
      padding: 24px;
      border: 1px dashed var(--md-sys-color-outline-variant);
      border-radius: var(--radius-xl);
      background-color: rgba(128, 128, 128, 0.04);
    }

    /* =========================================================================
       FLOATING CONFIGURATION PANEL
       ========================================================================= */
    .config-fab-dock {
      position: fixed;
      right: 16px;
      bottom: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 7px;
      padding: 8px;
      border-radius: var(--radius-pill);
      background-color: var(--md-sys-color-surface-container-high);
      border: 1px solid var(--md-sys-color-outline-variant);
      box-shadow: var(--md-shadow-3);
      z-index: 30;
      max-height: calc(100dvh - 32px);
      overflow-y: auto;
      scrollbar-width: none;
    }
    .config-fab-dock::-webkit-scrollbar { display: none; }

    .config-btn {
      position: relative;
      width: 42px;
      height: 42px;
      flex-shrink: 0;
      border-radius: var(--radius-pill);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--md-sys-color-on-surface);
      transition: background-color 150ms var(--ease-std), color 150ms var(--ease-std), transform 140ms var(--ease-std), opacity 150ms var(--ease-std);
    }
    .config-btn:hover:not(:disabled) { background-color: var(--md-sys-color-surface-container-highest); color: var(--md-sys-color-primary); }
    .config-btn:active:not(:disabled) { transform: scale(0.93); }
    .config-btn.active-state { background-color: var(--md-sys-color-primary-container); color: var(--md-sys-color-on-primary-container); }
    .config-btn.undo-dimmed { opacity: 0.35; color: var(--md-sys-color-on-surface-variant); cursor: default; }
    .config-btn.undo-active { opacity: 1; color: var(--md-sys-color-tertiary); background-color: rgba(129, 201, 149, 0.14); }
    .config-btn.unsaved-dirty {
      background-color: var(--md-sys-color-error);
      color: var(--md-sys-color-on-error);
      box-shadow: 0 0 0 2px rgba(242, 139, 130, 0.35);
    }
    .config-btn.unsaved-dirty:hover { filter: brightness(1.08); }
    #cfgMoreBtn { display: none; }

    /* =========================================================================
       POPUPS & MODALS
       ========================================================================= */
    .popover-card {
      position: fixed;
      background-color: var(--md-sys-color-surface-container-high);
      border: 1px solid var(--md-sys-color-outline-variant);
      border-radius: var(--radius-lg);
      box-shadow: var(--md-shadow-3);
      padding: 16px;
      z-index: 50;
      display: none;
      flex-direction: column;
      gap: 12px;
      animation: popIn 160ms var(--ease-emph);
    }
    .popover-card.open { display: flex; }

    @keyframes popIn {
      from { opacity: 0; transform: scale(0.96) translateY(4px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

    .grid-matrix-picker { right: 76px; bottom: 16px; width: 256px; }

    .matrix-cells {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 4px;
      padding: 6px;
      background-color: var(--md-sys-color-surface-container-lowest);
      border-radius: var(--radius-sm);
      border: 1px solid var(--md-sys-color-outline-variant);
    }

    .matrix-cell {
      aspect-ratio: 1;
      border-radius: 3px;
      border: 1px solid var(--md-sys-color-outline-variant);
      background-color: var(--md-sys-color-surface-container);
      transition: background-color 80ms linear, border-color 80ms linear;
    }
    .matrix-cell.highlighted { background-color: var(--md-sys-color-primary); border-color: var(--md-sys-color-primary); }
    .matrix-cell:disabled { opacity: 0.22; cursor: not-allowed; }

    .matrix-readout { text-align: center; font-size: 0.88em; font-weight: 700; color: var(--md-sys-color-primary); }

    .folder-creator-popover { left: 78px; bottom: 16px; width: 332px; max-width: calc(100vw - 92px); }

    .more-menu-popover { right: 8px; bottom: 64px; width: 210px; padding: 10px; gap: 6px; }
    .more-menu-popover button { width: 100%; justify-content: flex-start; }

    .icon-picker-grid {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 4px;
      max-height: 184px;
      overflow-y: auto;
      padding: 6px;
      border-radius: var(--radius-sm);
      background-color: var(--md-sys-color-surface-container-lowest);
      border: 1px solid var(--md-sys-color-outline-variant);
    }

    .icon-option-btn {
      width: 32px;
      height: 32px;
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--md-sys-color-on-surface-variant);
    }
    .icon-option-btn:hover { background-color: var(--md-sys-color-surface-container-high); color: var(--md-sys-color-on-surface); }
    .icon-option-btn.selected {
      background-color: var(--md-sys-color-primary-container);
      color: var(--md-sys-color-on-primary-container);
      outline: 2px solid var(--md-sys-color-primary);
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background-color: var(--md-sys-color-scrim);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 60;
      backdrop-filter: blur(2px);
    }
    .modal-backdrop.open { display: flex; }

    .modal-dialog {
      width: 100%;
      max-width: 460px;
      max-height: 90dvh;
      overflow-y: auto;
      background-color: var(--md-sys-color-surface-container-low);
      border: 1px solid var(--md-sys-color-outline);
      border-radius: var(--radius-lg);
      padding: 22px;
      box-shadow: var(--md-shadow-3);
      display: flex;
      flex-direction: column;
      gap: 14px;
      animation: popIn 170ms var(--ease-emph);
    }

    .modal-title { font-size: 1.12em; font-weight: 700; color: var(--md-sys-color-on-surface); }

    .field-group { display: flex; flex-direction: column; gap: 6px; }
    .field-label { font-size: 0.84em; font-weight: 600; color: var(--md-sys-color-on-surface-variant); }

    .field-input, .field-select {
      width: 100%;
      height: 42px;
      padding: 0 38px 0 12px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--md-sys-color-outline);
      background-color: var(--md-sys-color-surface-container-lowest);
      color: var(--md-sys-color-on-surface);
      font-size: 0.91em;
      outline: none;
      transition: border-color 140ms var(--ease-std);
    }
    .field-input { padding: 0 12px; }

    .field-select {
      appearance: none;
      -webkit-appearance: none;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%239aa5b4' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'/></svg>");
      background-repeat: no-repeat;
      background-position: right 12px center;
      background-size: 16px 16px;
    }
    .field-select option { background-color: var(--md-sys-color-surface-container); color: var(--md-sys-color-on-surface); }
    .field-input:focus, .field-select:focus { border-color: var(--md-sys-color-primary); }
    .field-input:focus-visible, .field-select:focus-visible { outline: none; }
    .field-input::placeholder { color: var(--md-sys-color-on-surface-variant); opacity: 0.58; }

    .modal-body-text { font-size: 0.91em; line-height: 1.55; color: var(--md-sys-color-on-surface-variant); }
    .modal-body-text p { margin-bottom: 10px; }

    .check-row { display: flex; align-items: center; gap: 8px; font-size: 0.86em; cursor: pointer; }
    .check-row input { width: 18px; height: 18px; accent-color: var(--md-sys-color-primary); }

    .inline-link-btn { color: var(--md-sys-color-primary); text-decoration: underline; font-weight: 600; font-size: inherit; padding: 0; }

    .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 6px; flex-wrap: wrap; }

    .btn-tonal, .btn-filled, .btn-outline, .btn-danger {
      height: 40px;
      padding: 0 18px;
      border-radius: var(--radius-sm);
      font-size: 0.88em;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: filter 140ms var(--ease-std), background-color 140ms var(--ease-std);
    }
    .btn-filled { background-color: var(--md-sys-color-primary); color: var(--md-sys-color-on-primary); }
    .btn-filled:hover { filter: brightness(1.08); }
    .btn-tonal { background-color: var(--md-sys-color-secondary-container); color: var(--md-sys-color-on-secondary-container); }
    .btn-tonal:hover { filter: brightness(1.06); }
    .btn-outline { border: 1px solid var(--md-sys-color-outline); color: var(--md-sys-color-on-surface); }
    .btn-outline:hover { background-color: var(--md-sys-color-surface-container-high); }
    .btn-danger { background-color: var(--md-sys-color-error); color: var(--md-sys-color-on-error); }
    .btn-danger:hover { filter: brightness(1.08); }

    /* Toast */
    .toast-bar {
      position: fixed;
      left: 50%;
      bottom: 20px;
      transform: translateX(-50%) translateY(80px);
      display: flex;
      align-items: center;
      gap: 14px;
      max-width: min(92vw, 640px);
      background-color: var(--md-sys-color-surface-container-highest);
      color: var(--md-sys-color-on-surface);
      border: 1px solid var(--md-sys-color-outline);
      padding: 10px 20px;
      border-radius: var(--radius-pill);
      box-shadow: var(--md-shadow-3);
      font-size: 0.88em;
      font-weight: 600;
      z-index: 80;
      opacity: 0;
      pointer-events: none;
      transition: transform 200ms var(--ease-emph), opacity 200ms var(--ease-std);
    }
    .toast-bar.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .toast-bar.has-action { pointer-events: auto; }
    .toast-action { color: var(--md-sys-color-primary); font-weight: 700; font-size: inherit; padding: 2px 6px; border-radius: var(--radius-sm); }
    .toast-action:hover { background-color: var(--md-sys-color-surface-container-high); }
    .toast-action[hidden] { display: none; }

       MOBILE

      .folder-sidebar.expanded {
        position: fixed;
        top: 0;
        left: 0;
        bottom: 68px;
        height: auto;
        width: 230px;
        min-width: 230px;
        z-index: 40;
      }

      .search-box { height: 46px; padding: 0 14px; }
      .search-hints { display: none; }

      .config-fab-dock {
        left: calc(var(--sidebar-compact-w) + 6px);
        right: 8px;
        bottom: 8px;
        flex-direction: row;
        justify-content: space-evenly;
        gap: 2px;
        padding: 5px 6px;
        border-radius: var(--radius-pill);
        max-height: none;
        overflow: visible;
      }

      .config-btn { width: 40px; height: 40px; }
      .config-btn .icon-svg { width: 21px; height: 21px; }
      .config-btn.rare-action { display: none; }
      #cfgMoreBtn { display: flex; }

      .grid-matrix-picker { left: 50%; right: auto; bottom: 64px; transform: translateX(-50%); }
      .folder-creator-popover { left: calc(var(--sidebar-compact-w) + 8px); bottom: 70px; }
      .toast-bar { bottom: 68px; }
      .bookmark-favicon-pane { width: 32px; height: 36px; }
      .bookmark-title { font-size: 0.86em; }
      .tag-chip { font-size: 0.72em; padding: 1px 5px; }
    }

    @media (max-width: 720px) and (pointer: coarse) {
      .tag-chip { padding: 3px 7px; }
    }
  </style>
